<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>GURPS · Ficha do jogador</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 0 0,#5f4c3440,transparent 52%),#0e111b;color:#f4ede2;font:14px/1.5 system-ui,sans-serif}main{max-width:910px;margin:auto;padding:17px 13px 90px}h1,h2,h3{font-family:Georgia,serif;font-weight:500;line-height:1.15}h1{font-size:31px;margin:4px 0}h2{font-size:24px;margin:6px 0}h3{font-size:20px}small,.muted{color:#afa8ac;font-size:11px}.eyebrow{color:#dbba8b;letter-spacing:.14em;font-size:10px;font-weight:700}.panel{background:#1b1e29;border:1px solid #a3886855;padding:16px;border-radius:15px;margin:12px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top img{width:75px;height:91px;object-fit:cover;border-radius:11px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.stat{padding:11px;text-align:center;background:#131721;border:1px solid #6a5c4f;border-radius:11px}.stat strong{display:block;font:500 27px Georgia,serif}.stat small{display:block}button,input,textarea{font:inherit;color:inherit}button{min-height:38px;border-radius:9px;background:#353241;border:1px solid #8e7c6a;padding:9px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #eacfa2}button.primary{background:#d8bb92;color:#1b171e;font-weight:700}input{background:#10141e;border:1px solid #60534a;border-radius:9px;min-height:38px;padding:9px;max-width:100%}.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.flex{flex:1}.tabs{display:flex;overflow-x:auto;gap:7px;padding:8px 0;position:sticky;top:0;z-index:2;background:#0e111be8}.tabs button{flex:none;white-space:nowrap}.tabs button[aria-selected=true]{border-color:#e1b97c;background:#9d7f5e;color:#fff}.item{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff1c}.item small{display:block}.item button{min-width:70px}.resources{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.resource{background:#12151d;padding:12px;border-radius:12px;border:1px solid #ffffff26}.resource strong{font-size:22px}.resource button{min-width:40px}.progress{height:9px;background:#06080d;border-radius:99px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#957150,#e5ca95)}.tabsection[hidden]{display:none!important}.tabsection{margin-top:12px}.note{white-space:pre-wrap;overflow-wrap:anywhere}.canvas{height:430px;background-color:#121622;background-image:radial-gradient(#ffffff2e 1px,transparent 1px);background-size:24px 24px;border:1px solid #ffffff30;border-radius:12px;overflow:hidden;touch-action:none;position:relative}.world{position:absolute;inset:0;transform-origin:0 0}.card{position:absolute;width:175px;min-height:110px;background:#24222a;border:1px solid #c2a174;padding:10px;border-radius:12px;touch-action:none}.card strong{display:block;touch-action:none;cursor:grab}.card p{font-size:11px;white-space:pre-wrap;max-height:120px;overflow:auto}#overlay{position:fixed;top:15%;left:50%;transform:translateX(-50%);width:min(90vw,420px);border:1px solid #e5c795;border-radius:16px;background:#151722f5;box-shadow:0 15px 80px #000e;z-index:5;text-align:center;padding:17px;opacity:0;pointer-events:none;transition:opacity .2s}#overlay.visible{opacity:1}.faces{display:flex;justify-content:center;gap:9px}.face{width:51px;height:54px;background:#d7bc90;color:#201c19;clip-path:polygon(50% 0,96% 25%,96% 75%,50% 100%,4% 75%,4% 25%);display:grid;place-items:center;font-size:23px;font-weight:800;animation:drop .65s ease-out both}@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(200deg)}to{opacity:1;transform:none}}#message{color:#e9c58f;font-size:12px}a{color:#e9c58f}#sync{color:#b3c5b6}h4{font-size:14px;margin-bottom:5px}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.resources{grid-template-columns:1fr}.item{align-items:flex-start}.tabs button{font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main><header class="top"><div><div class="eyebrow">RPG MESA · GURPS 4e</div><h1 id="campaign">Campanha</h1><small id="sync">Conectando…</small></div><button id="return-link">Meu link</button></header><div class="stats"><div class="stat"><small>Cena</small><strong id="scene">—</strong></div><div class="stat"><small>Rodada</small><strong id="turn">—</strong></div></div><div id="hero" class="panel"></div><p id="nickname" class="muted"></p><nav id="tabs" class="tabs" aria-label="Abas GURPS"><button data-tab="atributos" aria-selected="true">Atributos</button><button data-tab="pericias" aria-selected="false">Perícias</button><button data-tab="vantagens" aria-selected="false">Vantagens</button><button data-tab="combate" aria-selected="false">Combate</button><button data-tab="equip" aria-selected="false">Equipamento</button><button data-tab="magia" aria-selected="false">Magia</button><button data-tab="historia" aria-selected="false">História</button><button data-tab="canvas" aria-selected="false">Canvas</button></nav><section id="atributos" class="panel tabsection"></section><section id="pericias" class="panel tabsection" hidden></section><section id="vantagens" class="panel tabsection" hidden></section><section id="combate" class="panel tabsection" hidden></section><section id="equip" class="panel tabsection" hidden></section><section id="magia" class="panel tabsection" hidden></section><section id="historia" class="panel tabsection" hidden></section><section id="canvas" class="panel tabsection" hidden></section><p id="message" role="status"></p></main><div id="overlay" role="status" aria-live="polite"></div><script>'use strict';
const $=s=>document.querySelector(s),cid=location.pathname.split('/')[2],esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=null,last=null,tab='atributos',busy=false,nodes=[],pan={x:0,y:0},scale=1,drag=null;
const skillBase={E:0,A:-1,H:-2,VH:-3};
const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const derived=s=>{const a=s.attrs||{},m=s.mod||{},st=num(a.ST,10),dx=num(a.DX,10),iq=num(a.IQ,10),ht=num(a.HT,10),speed=(dx+ht)/4+num(m.speed),move=Math.floor(speed)+num(m.move);
 const weight=[...(s.items||[]),...(s.weapons||[])].reduce((x,i)=>x+Math.max(0,num(i.weight))*Math.max(0,num(i.qty,1)),0),bc=st*st/10,enc=weight<=bc?0:weight<=2*bc?1:weight<=3*bc?2:weight<=6*bc?3:4;
 return{HP:Math.max(1,st+num(m.hp)),FP:Math.max(1,ht+num(m.fp)),ST:st,DX:dx,IQ:iq,HT:ht,Will:iq+num(m.will),Per:iq+num(m.per),speed,move,enc,dodge:Math.floor(speed)+3-enc+num(s.settings?.shieldDB),bc,weight};};
const level=(sk,s,d)=>{const p=num(sk.points);if(p<1)return null;let off=skillBase[sk.diff];if(off===undefined)return null;off+=p>=8?3+Math.floor((p-8)/4):p>=4?2:p>=2?1:0;return num((sk.attr==='Per'?d.Per:sk.attr==='Will'?d.Will:s.attrs?.[sk.attr]),10)+off+num(sk.bonus)};
function secureDie(){const a=new Uint32Array(1),max=Math.floor(4294967296/6)*6;do{crypto.getRandomValues(a)}while(a[0]>=max);return 1+a[0]%6;}
function displayRoll(label,target=null){
 const faces=[secureDie(),secureDie(),secureDie()],total=faces.reduce((a,b)=>a+b,0),t=num(target),margin=target===null?null:t-total;
 const crit=target===null?'':total<=4||(total===5&&t>=15)||(total===6&&t>=16)?'Sucesso decisivo':total===18||(total===17&&t<=15)||total>=t+10?'Falha crítica':total<=t?'Sucesso':'Falha';
 const overlay=$('#overlay');overlay.innerHTML='<div class="eyebrow">'+esc(label)+'</div><div class="faces">'+faces.map((n,i)=>'<div class="face" style="animation-delay:'+i*90+'ms">'+n+'</div>').join('')+'</div><h2>'+total+(target===null?'':' / NH '+t)+'</h2><p>'+esc(crit)+(margin===null?'':' · margem '+margin)+'</p>';
 overlay.classList.add('visible');setTimeout(()=>overlay.classList.remove('visible'),3500);
 fetch('/api/play/'+cid+'/roll',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:label,formula:'3d6',faces:faces.join(','),total})}).catch(()=>{});
}
function pills(){const s=data.character,d=derived(s);return ['ST','DX','IQ','HT','Will','Per'].map(k=>'<div class="stat"><small>'+k+'</small><strong>'+d[k]+'</strong><button data-roll="'+k+'">🎲</button></div>').join('')}
function updateView(){
 if(!data)return;const s=data.character,d=derived(s);$('#campaign').textContent=data.campaign;$('#scene').textContent=data.sceneName;$('#turn').textContent=data.turn;$('#nickname').textContent=data.nickname+' · #'+data.shortId;
 $('#hero').innerHTML='<div class="top"><div class="row">'+(s.portrait&&/^data:image\/(jpeg|png|webp);base64,/.test(s.portrait)?'<img src="'+esc(s.portrait)+'" alt="Retrato">':'')+'<div><div class="eyebrow">GURPS • 4ª EDIÇÃO</div><h1>'+esc(s.name)+'</h1><small>'+esc(s.concept||'Personagem')+' · NT '+esc(s.techLevel||8)+'</small></div></div><span class="eyebrow">'+esc(s.pointBudget)+' pontos</span></div>';
 $('#atributos').innerHTML='<h2>Atributos</h2><div class="stats">'+pills()+'</div><h3>Recursos</h3><div class="resources">'+[['HP',d.HP,num(s.currentHP,d.HP)],['FP',d.FP,num(s.currentFP,d.FP)]].map(([key,max,cur])=>'<div class="resource"><strong>'+key+': '+cur+' / '+max+'</strong><div class="progress"><i style="width:'+Math.max(0,Math.min(100,cur/max*100))+'%"></i></div><div class="row"><button data-resource="'+key+'" data-delta="-1">−1</button><button data-resource="'+key+'" data-delta="1">+1</button><small>Pontos '+(key==='HP'?'de Vida':'de Fadiga')+'</small></div></div>').join('')+'</div><h3>Combate e carga</h3><div class="stats">'+[['Esquiva',d.dodge],['Vel. Básica',d.speed],['Deslocamento',d.move],['Base Carga',d.bc.toFixed(1)+' kg'],['Carga',d.weight.toFixed(1)+' kg'],['Penalidade por carga',d.enc]].map(([a,b])=>'<div class="stat"><small>'+a+'</small><strong>'+b+'</strong></div>').join('')+'</div>';
 $('#pericias').innerHTML='<h2>Perícias</h2><p class="muted">Teste de 3d6 menor ou igual ao nível de habilidade (NH). Penalidades situacionais são definidas pelo mestre.</p>'+(s.skills||[]).map((sk,i)=>'<div class="item"><div><strong>'+esc(sk.name)+'</strong><small>'+esc(sk.attr)+' / '+esc(sk.diff)+' · '+sk.points+' pontos · NH '+(level(sk,s,d)??'—')+'</small></div><button data-skill="'+i+'">🎲 Testar</button></div>').join('')+'<div class="row" style="margin:15px 0"><input id="mod" type="number" min="-30" max="30" value="0" style="width:100px" aria-label="Modificador situacional"><small>Modificador situacional (+/− NH)</small></div>';
 $('#vantagens').innerHTML='<h2>Vantagens e desvantagens</h2>'+[['advantages','Vantagens'],['disadvantages','Desvantagens'],['quirks','Peculiaridades'],['languages','Idiomas'],['cultures','Culturas']].map(([k,title])=>'<h3>'+title+'</h3>'+(s[k]||[]).map(x=>'<div class="item"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.details||'')+'</small></div><small>'+x.points+' pts</small></div>').join('')).join('');
 $('#combate').innerHTML='<h2>Combate e armas</h2><div class="row"><button data-defense="dodge">🎲 Esquiva '+d.dodge+'</button>'+(s.parrySkill?'<button data-defense="parry">🎲 Aparar</button>':'')+(s.blockSkill?'<button data-defense="block">🎲 Bloqueio</button>':'')+'</div><h3>Armas</h3>'+(s.weapons||[]).map((w,i)=>'<div class="item"><div><strong>'+esc(w.name)+'</strong><small>'+esc(w.damage||'Dano sem fórmula')+' · '+esc(w.damageType||'')+'</small></div><button data-attack="'+i+'">🎲 Ataque</button></div>').join('')+'<p class="muted">Os danos exigem a verificação da arma, RD, localização e tipo de ferimento. As rolagens de dano detalhadas permanecem no app do mestre.</p>';
 $('#equip').innerHTML='<h2>Equipamento</h2>'+(s.items||[]).map(x=>'<div class="item"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.category||'Equipamento')+' · '+esc(x.qty||1)+'× · '+esc(x.weight||0)+' kg · RD '+esc(x.dr||0)+'</small></div><small>'+(x.equipped?'Equipado':'Guardado')+'</small></div>').join('')+'<p class="muted">O mestre controla a edição estrutural do inventário.</p>';
 $('#magia').innerHTML='<h2>Magia e poderes</h2>'+(s.spells||[]).map(x=>'<div class="item"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.details||'')+'</small></div></div>').join('')+'<p class="muted">Os efeitos e custos dependem dos suplementos habilitados pelo mestre.</p>';
 $('#historia').innerHTML='<h2>História</h2><p class="note">'+esc(s.background||'Sem história cadastrada.')+'</p><h3>Notas</h3><p class="note">'+esc(s.notes||'')+'</p>';
}
function activate(id){tab=id;document.querySelectorAll('.tabsection').forEach(x=>x.hidden=x.id!==id);document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===id)));if(id==='canvas')renderCanvas();}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)activate(b.dataset.tab)};
document.addEventListener('click',async e=>{
 const roll=e.target.closest('[data-roll]'),sk=e.target.closest('[data-skill]'),res=e.target.closest('[data-resource]'),atk=e.target.closest('[data-attack]'),def=e.target.closest('[data-defense]');
 if(roll&&data){const d=derived(data.character);displayRoll(roll.dataset.roll,d[roll.dataset.roll]);}
 if(sk&&data){const s=data.character,skill=s.skills[Number(sk.dataset.skill)],d=derived(s),base=level(skill,s,d),mod=num($('#mod')?.value);if(base!==null)displayRoll('Perícia: '+skill.name,base+mod);}
 if(atk&&data){const s=data.character,w=s.weapons[Number(atk.dataset.attack)],d=derived(s),skill=s.skills[Number(w.skillIndex)],base=skill?level(skill,s,d):d.DX;displayRoll('Ataque: '+w.name,base);}
 if(def&&data){const s=data.character,d=derived(s),kind=def.dataset.defense;displayRoll('Defesa: '+kind,kind==='dodge'?d.dodge:Math.floor(num(kind==='parry'?s.parrySkill:s.blockSkill)/2)+3);}
 if(res&&data){const k=res.dataset.resource,s=data.character,d=derived(s),max=d[k],prop=k==='HP'?'currentHP':'currentFP';const cur=Math.max(-max*5,Math.min(max,num(s[prop])+num(res.dataset.delta)));try{const r=await fetch('/api/play/'+cid+'/resource',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource:k,current:cur})});if(!r.ok)throw Error((await r.json()).error);await refresh(true)}catch(err){$('#message').textContent=err.message;}}
});
async function refresh(force=false){if(busy)return;busy=true;try{const r=await fetch('/api/play/'+cid,{cache:'no-store',credentials:'same-origin'});const x=await r.json();if(!r.ok)throw Error(x.error||'Sessão inválida');if(x.character?.systemId!=='gurps')throw Error('Ficha GURPS não atribuída. Aguarde o mestre.');
 const rev=JSON.stringify(x.character);if(force||rev!==last){last=rev;data=x;updateView();}else{data=x;$('#scene').textContent=x.sceneName;$('#turn').textContent=x.turn;}
 $('#campaign').textContent=x.campaign;$('#nickname').textContent=x.nickname+' · #'+x.shortId;$('#sync').textContent='● Sincronizado';
 }catch(e){$('#sync').textContent='● Tentando reconectar';$('#message').textContent=e.message}finally{busy=false}}
$('#return-link').onclick=async()=>{if(!data?.permalink)return;try{await navigator.clipboard.writeText(data.permalink);$('#message').textContent='Link pessoal copiado.'}catch{$('#message').textContent='Seu link: '+data.permalink}};
function renderCanvas(){
 const host=$('#canvas');host.innerHTML='<h2>Canvas pessoal</h2><p class="muted">Notas só suas, armazenadas na campanha; o mestre não as recebe pelo painel.</p><div class="row"><button id="new-note">+ Nota</button><button id="save-notes" class="primary">Salvar</button><button id="zoom-plus">+</button><button id="zoom-minus">−</button></div><div class="canvas" id="viewport"><div class="world" id="world" style="transform:translate('+pan.x+'px,'+pan.y+'px) scale('+scale+')">'+nodes.map((n,i)=>'<div class="card" data-node="'+i+'" style="left:'+n.x+'px;top:'+n.y+'px"><strong data-drag="'+i+'">'+esc(n.title)+'</strong><p>'+esc(n.text)+'</p><button data-edit="'+i+'">Editar</button> <button data-del="'+i+'">Excluir</button></div>').join('')+'</div></div>';
}
$('#canvas').onclick=async e=>{if(e.target.id==='new-note'){let title=prompt('Título');if(title!==null){nodes.push({id:crypto.randomUUID(),title:title.slice(0,90),text:'',x:60,y:60});renderCanvas()}}
 if(e.target.id==='zoom-plus'){scale=Math.min(2,scale+.2);renderCanvas()}if(e.target.id==='zoom-minus'){scale=Math.max(.3,scale-.2);renderCanvas()}
 if(e.target.id==='save-notes'){try{const r=await fetch('/api/play/'+cid+'/canvas',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({nodes})});if(!r.ok)throw Error((await r.json()).error);$('#message').textContent='Canvas salvo'}catch(e){$('#message').textContent=e.message}}
 const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');
 if(edit){let n=nodes[+edit.dataset.edit],txt=prompt('Texto da nota',n.text);if(txt!==null){n.text=txt.slice(0,3000);renderCanvas()}}
 if(del){nodes.splice(+del.dataset.del,1);renderCanvas()}
};
$('#canvas').onpointerdown=e=>{const card=e.target.closest('[data-drag]'),n=nodes[Number(card?.dataset.drag)];
 if(card&&n){drag={kind:'node',idx:+card.dataset.drag,x:e.clientX,y:e.clientY,ox:n.x,oy:n.y};card.setPointerCapture(e.pointerId);e.preventDefault();return}
 const vp=e.target.closest('#viewport');if(vp){drag={kind:'pan',x:e.clientX,y:e.clientY,ox:pan.x,oy:pan.y};vp.setPointerCapture(e.pointerId);e.preventDefault()}
};
$('#canvas').onpointermove=e=>{if(!drag)return;if(drag.kind==='pan'){pan.x=drag.ox+e.clientX-drag.x;pan.y=drag.oy+e.clientY-drag.y;}
 else{let n=nodes[drag.idx];n.x=drag.ox+(e.clientX-drag.x)/scale;n.y=drag.oy+(e.clientY-drag.y)/scale;}
 const world=$('#world');if(world)world.style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+scale+')';
 if(drag.kind==='node'){const el=document.querySelector('[data-node="'+drag.idx+'"]');if(el){el.style.left=nodes[drag.idx].x+'px';el.style.top=nodes[drag.idx].y+'px'}}
};
$('#canvas').onpointerup=()=>drag=null;$('#canvas').onpointercancel=()=>drag=null;
async function loadNotes(){try{const r=await fetch('/api/play/'+cid+'/canvas',{cache:'no-store'});const x=await r.json();if(Array.isArray(x.nodes))nodes=x.nodes;}catch{}}
activate('atributos');loadNotes();refresh();setInterval(()=>{if(!document.hidden)refresh()},2000);window.addEventListener('focus',()=>refresh());document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});</script></body></html>
