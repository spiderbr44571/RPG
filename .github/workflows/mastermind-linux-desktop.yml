name: Mastermind Linux Desktop — portável x64
on:
  push:
    branches:
      - feature/mastermind-linux-desktop-v1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências de teste e ícones Linux
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-0 libfuse2t64
          python3 -m pip install --break-system-packages --quiet pillow
          python3 desktop/make_icon.py
      - name: Instalar Electron, PDF.js e empacotador
        run: npm --prefix desktop install --no-audit --no-fund
      - name: Testar arquitetura Linux e regressões do RPG
        run: |
          set -euo pipefail
          npm --prefix desktop run check
          npm --prefix desktop test
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
          node tests/pixelportrait90.test.cjs
      - name: Teste real de inicialização da janela em Xvfb
        env:
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          set -euo pipefail
          timeout 40s xvfb-run -a -s "-screen 0 1440x900x24" \
            desktop/node_modules/.bin/electron desktop --smoke-test --no-sandbox 2>&1 | tee desktop-smoke.log
          grep -q 'LINUX SMOKE' desktop-smoke.log
      - name: Compilar distribuição Linux executável e gerar pacote portátil
        run: |
          set -euo pipefail
          npm --prefix desktop run dist:linux
          test -x desktop/dist/linux-unpacked/mastermind
          test -f desktop/dist/linux-unpacked/resources/app.asar
          test -f desktop/dist/linux-unpacked/resources/web/demo-offline.html
          tar -C desktop/dist -czf desktop/dist/Mastermind-Linux-1.0.0-x64.tar.gz linux-unpacked
          test -s desktop/dist/Mastermind-Linux-1.0.0-x64.tar.gz
          sha256sum desktop/dist/Mastermind-Linux-1.0.0-x64.tar.gz > desktop/dist/SHA256SUMS
          ls -lh desktop/dist/Mastermind-Linux-* desktop/dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Mastermind-Linux-v1.0.0-Portable
          if-no-files-found: error
          path: |
            desktop/dist/*.tar.gz
            desktop/dist/SHA256SUMS
            desktop-smoke.log
      - name: Publicar release Linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-linux-v1.0.0-beta"
          ASSETS=(desktop/dist/Mastermind-Linux-1.0.0-x64.tar.gz desktop/dist/SHA256SUMS)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${ASSETS[@]}" --target "${GITHUB_SHA}" \
              --title "Mastermind Linux 1.0.0 beta — Port Desktop" \
              --notes "Primeira build Linux x86-64 do Mastermind v0.90: mesmos motores RPG, fichas, biblioteca, busca offline, canvas, mesa, bestiário, configurações e Ateliê lyime incorporado com Godot original. Layouts de desktop, teclado, PDFs pessoais indexados localmente, exportação PNG/PDF, backups JSON. Distribuição tar.gz portátil e SHA256SUMS de verificação de integridade (hashes de integridade, não assinatura criptográfica). Limitante: o backend completo de hospedagem LAN exclusivo do Android ainda não tem paridade nesta build; PDFs e dados existentes precisam ser importados manualmente. Teste visual em CachyOS/Hyprland recomendado."
          else
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          fi
