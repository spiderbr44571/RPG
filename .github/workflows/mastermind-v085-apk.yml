name: Mastermind v0.85 — Nonemo CC0 Character Studio
on:
  push:
    branches:
      - feature/mastermind-v085-nonemo-asset-pack
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Montar pacote CC0 original offline sem IA
        run: |
          set -euo pipefail
          python3 scripts/prepare_nonemo85.py
      - name: Validar arte original, componentes, regras e integracao
        run: |
          set -euo pipefail
          node --check app/src/main/assets/nonemo85_assets.js
          node --check app/src/main/assets/nonemo85_renderer.js
          node --check app/src/main/assets/nonemo85_studio.js
          python3 tests/test_nonemo85.py
          node tests/nonemo85.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Preparar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar app Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Validar APK real e assinatura
        run: |
          set -euo pipefail
          python3 tests/verify_apk_v85.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > nonemo85-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.85-Nonemo-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            nonemo85-sha256.txt
          if-no-files-found: error
      - name: Publicar versao APK no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.85-nonemo-cc0"
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.85-Android.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.85-Android.apk --target "${GITHUB_SHA}" \
              --title "Mastermind v0.85 — Ateliê Nonemo CC0" \
              --notes "Novo Ateliê com as 180 peças PNG 2x originais de nemo/nonemo (CC0). Montagem modular real: cabelos frontais e traseiros, tons de pele, expressões, olhos, bocas, barbas, roupas, mangas, calças e óculos. Fonte offline incorporada ao APK para WebView sem erros, retratos e tokens PNG, salvamento na ficha e seletor nativo de exportação. Sem imagens geradas por IA. Build Android debug assinada."
          else
            gh release upload "$TAG" Mastermind-v0.85-Android.apk --clobber
          fi