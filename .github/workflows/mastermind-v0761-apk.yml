name: Mastermind v0.76.1 APK direto
on:
  push:
    branches:
      - fix/mastermind-v0761-atelier-mobile-navigation
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configurar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Incorporar pranchas de personagens originais no APK
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/atelier
          base64 -d app/asset_sources/atelier_portraits_f.b64 > app/src/main/assets/atelier/feminino.webp
          base64 -d app/asset_sources/atelier_portraits_m.b64 > app/src/main/assets/atelier/masculino.webp
          base64 -d app/asset_sources/atelier_outfits.b64 > app/src/main/assets/atelier/roupas.webp
          base64 -d app/asset_sources/atelier_interface.b64 > app/src/main/assets/atelier/interface.webp
          for img in app/src/main/assets/atelier/*.webp; do
            test "$(head -c 4 "$img")" = "RIFF"
            test "$(wc -c < "$img")" -gt 100000
          done
      - name: Validar scripts e dados GURPS
        run: |
          node --check app/src/main/assets/rpg16_gurps_ui.js
          node --check app/src/main/assets/rpg16_gurps_traits.js
          node --check app/src/main/assets/mastermind62_descriptions.js
          node --check app/src/main/assets/mastermind63_gurps_summaries.js
          node --check app/src/main/assets/mastermind63_gurps_skill_pt.js
          node --check app/src/main/assets/mastermind63_srd_summaries.js
          node --check app/src/main/assets/mastermind63_order_summaries.js
          node --check app/src/main/assets/mastermind56_local_powers.js
          node --check app/src/main/assets/rpg18_dnd_ui.js
          node tests/gurps4.test.cjs
          node tests/mastermind_v61.test.cjs
          node tests/mastermind_v60.test.cjs
          node tests/mastermind_v62.test.cjs
          node tests/mastermind_v63.test.cjs
          node --check app/src/main/assets/rpg31_master_table.js
          node tests/mastermind_v64.test.cjs
          node tests/mastermind_v65.test.cjs
          node --check app/src/main/assets/mastermind66_spells.js
          node --check app/src/main/assets/mastermind66_grimoire_engine.js
          node --check app/src/main/assets/mastermind66_grimoire_ui.js
          node tests/mastermind_v66.test.cjs
          node --check app/src/main/assets/mastermind68_map_layers.js
          node --check app/src/main/assets/rpg29_scene_editor.js
          node --check app/src/main/assets/rpg31_master_table.js
          node --check app/src/main/assets/rpg31_player_table.js
          node tests/mastermind_v68.test.cjs
          node --check app/src/main/assets/mastermind69_atmosphere.js
          node --check app/src/main/assets/rpg29_scene_editor.js
          node --check app/src/main/assets/rpg31_master_table.js
          node --check app/src/main/assets/rpg31_player_table.js
          node --check app/src/main/assets/mastermind72_volume.js
          node tests/mastermind_v72.test.cjs
          node tests/mastermind_v73.test.cjs
          node --check app/src/main/assets/mastermind74_icons.js
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
          node --check app/src/main/assets/mastermind76_atelier.js
          node tests/mastermind_v76.test.cjs
          node tests/mastermind_v0761.test.cjs
      - name: Compilar APK Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Validar APK e assinatura
        run: |
          python3 tests/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
      - name: Publicar Mastermind v0.76 APK
        uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.76.1-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error

      - name: Disponibilizar APK direto no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.76.1-atelier-acesso-mobile"
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.76.1-Android.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.76.1-Android.apk \
              --target "${GITHUB_SHA}" \
              --title "Mastermind v0.76.1 — Botão do Ateliê no Android" \
              --notes "Correção da v0.76: Ateliê com ícone de roupa adicionado à Central da Mesa real no Android, aberta pelo botão de casinha; atalho também na tela de Fichas/Personagens. O Ateliê original, as quatro pranchas de arte, fichas, tokens e demais sistemas continuam incluídos."
          else
            gh release upload "$TAG" Mastermind-v0.76.1-Android.apk --clobber
          fi
