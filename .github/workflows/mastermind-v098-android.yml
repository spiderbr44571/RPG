name: Mastermind Android v0.98 — Busca e biblioteca multissistema
on:
  push:
    branches:
      - feature/android-v098-search
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Testes regressivos e compilacao Android v0.98
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Incorporar biblioteca PDF offline (sem CDN em execução)
        run: |
          set -euo pipefail
          npm install --prefix .mm-pdf-deps --no-audit --no-fund --ignore-scripts pdf-lib@1.17.1
          cp .mm-pdf-deps/node_modules/pdf-lib/dist/pdf-lib.min.js app/src/main/assets/pdf-lib.min.js
          test -s app/src/main/assets/pdf-lib.min.js
      - name: Validar sintaxe das funcionalidades adicionadas
        run: |
          set -euo pipefail
          node --check app/src/main/assets/mastermind_coc7_engine.js
          node --check app/src/main/assets/mastermind_coc7_ui.js
          node --check app/src/main/assets/mastermind_sheet_studio.js
          node --check app/src/main/assets/mastermind_system_pdf.js
          node --check app/src/main/assets/mastermind_ordem_template.js
          node --check app/src/main/assets/mastermind_system_editor.js
          node --check app/src/main/assets/mastermind56_local_powers.js
          node --check app/src/main/assets/rpg17_sheet_pdf.js
          node --check app/src/main/assets/mastermind51_private_books.js
          node --check app/src/main/assets/rpg15_catalog.js
          node --check app/src/main/assets/mastermind_search_vocabulary.js
          node --check app/src/main/assets/rpg28_context_search.js
          node --check app/src/main/assets/rpg26_offline_search_ui.js
          node --check app/src/main/assets/mastermind51_private_books.js
          node --check app/src/main/assets/rpg11_campaigns.js
      - name: Testes Android, CoC, PDFs, Godot e compatibilidade
        run: |
          set -euo pipefail
          node --test tests/mastermind_v098_android.test.cjs tests/mastermind_sheet_studio.test.cjs tests/mastermind_v094_powers.test.cjs
          NODE_PATH="$PWD/.mm-pdf-deps/node_modules" node --test tests/mastermind_v095_pdf_templates.test.cjs tests/mastermind_v096_ordem_template.test.cjs tests/mastermind_v098_system_editor.test.cjs
          node tests/pixelportrait90.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Preparar SDK Android
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar assinatura persistente configurada nos Secrets
        env:
          MM_KEY_B64: ${{ secrets.MASTERMIND_ANDROID_KEYSTORE_BASE64 }}
          MM_PASS: ${{ secrets.MASTERMIND_ANDROID_STORE_PASSWORD }}
          MM_ALIAS: ${{ secrets.MASTERMIND_ANDROID_KEY_ALIAS }}
          MM_KEYPASS: ${{ secrets.MASTERMIND_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${MM_KEY_B64:-}" && -n "${MM_PASS:-}" && -n "${MM_ALIAS:-}" && -n "${MM_KEYPASS:-}" ]]; then
            printf '%s' "$MM_KEY_B64" | base64 -d > "$RUNNER_TEMP/mastermind-signing.jks"
            echo "MASTERMIND_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mastermind-signing.jks" >> "$GITHUB_ENV"
            echo "MASTERMIND_ANDROID_STORE_PASSWORD=$MM_PASS" >> "$GITHUB_ENV"
            echo "MASTERMIND_ANDROID_KEY_ALIAS=$MM_ALIAS" >> "$GITHUB_ENV"
            echo "MASTERMIND_ANDROID_KEY_PASSWORD=$MM_KEYPASS" >> "$GITHUB_ENV"
            echo "MM_ASSEMBLY=Release" >> "$GITHUB_ENV"
            echo "MM_APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::Assinatura persistente não configurada. Este APK debug não substitui APKs com outros certificados."
            echo "MM_ASSEMBLY=Debug" >> "$GITHUB_ENV"
            echo "MM_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK Android com assinatura configurada
        run: gradle :app:assemble${MM_ASSEMBLY} --no-daemon
      - name: Conferir assets, pontes nativas e assinatura
        run: |
          set -euo pipefail
          python3 tests/verify_apk_v98.py "$MM_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$MM_APK"
          cp "$MM_APK" Mastermind-v0.98-Android-Busca-Livros.apk
          sha256sum Mastermind-v0.98-Android-Busca-Livros.apk > Mastermind-v0.98-Android-SHA256.txt
      - name: Publicar APK no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.98-Android-BUSCA-LIVROS-APK
          path: |
            Mastermind-v0.98-Android-Busca-Livros.apk
            Mastermind-v0.98-Android-SHA256.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publicar APK para download direto no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.98-android-busca-livros"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Mastermind-v0.98-Android-Busca-Livros.apk Mastermind-v0.98-Android-SHA256.txt --clobber
          else
            gh release create "$TAG" Mastermind-v0.98-Android-Busca-Livros.apk Mastermind-v0.98-Android-SHA256.txt \
              --target "$GITHUB_SHA" --title "Mastermind Android v0.98 — Busca offline e biblioteca multissistema" \
              --notes "Pesquisa offline aprimorada com aliases para D&D, GURPS e Chamado de Cthulhu, leitura de páginas com alerta de caracteres ilegíveis e biblioteca sem recomendação fixa de Ordem Paranormal. Importação de PDFs pessoais continua necessária. Sem chave de assinatura persistente nos secrets, o APK debug pode não substituir uma versão instalada."
          fi
