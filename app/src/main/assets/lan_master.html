<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPG Mesa · Mestre</title><style>
:root{--bg:#0c0e16;--panel:#1c1c28;--line:#574d57;--accent:#dca4bd;--fg:#f1e8e3;--muted:#afa1b0}
*{box-sizing:border-box}body{background:radial-gradient(circle at 85% 0,#54203644,transparent 45%),var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;margin:0;padding:18px}main{max-width:1050px;margin:0 auto}h1,h2,h3{font-family:Georgia,serif;font-weight:normal;color:#f3c8dc}h1{font-size:32px}.muted,small{color:var(--muted)}section,article{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:16px;margin:13px 0}label{display:block;margin:10px 0 5px}input,select,textarea,button{font:inherit;max-width:100%;border-radius:9px;border:1px solid #6b596c;background:#10121b;color:var(--fg);padding:10px;min-height:42px}input[type=text],input[type=password],textarea{width:100%}textarea{min-height:145px;resize:vertical;font-family:monospace}button{cursor:pointer}button.primary{background:#834267;color:white;border-color:#e4a2c6}button.danger{background:#3a1c24;color:#ffb6bd}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.grid article{margin:0}.status{border-left:3px solid var(--accent);padding:10px;background:#17141f;border-radius:6px}a{color:#efb6d3}.pill{display:inline-block;border-radius:99px;border:1px solid #8d6785;padding:4px 10px;font-size:11px}code{word-break:break-all}.res{display:flex;align-items:center;gap:8px;margin:13px 0}.res strong{min-width:65px}.res button{min-width:44px}.res span{min-width:75px;text-align:center}.portrait{width:76px;height:76px;object-fit:cover;border-radius:10px}.head{display:flex;gap:16px;align-items:center}.hidden{display:none!important}@media(max-width:540px){body{padding:12px}.grid{grid-template-columns:1fr}}
</style><script src="/scene-bestiary.js"></script><script src="/map-layers.js"></script><script src="/scene-editor.js"></script><script src="/table-camera.js"></script><script src="/table-master.js"></script><main><h1>✧ Mestragem</h1><p class="muted">Campanhas deste celular • Rede local confiável. Apenas o mestre deve conhecer a chave administrativa.</p>
<section id="login"><h2>Acessar como mestre</h2><label>Chave administrativa do anfitrião</label><input id="key" type="password" autocomplete="off"><button class="primary" id="sign">Entrar</button></section>
<div id="console" class="hidden"><section><h2>Criar campanha</h2><div class="row"><input id="new" type="text" placeholder="Nome da campanha" maxlength="90" style="flex:1"><button id="create" class="primary">Criar</button></div></section><section><h2>Campanhas</h2><div id="campaigns" class="row"></div></section><div id="details"></div></div><p id="feedback" class="status" role="status"></p></main><script>
'use strict';
const $=s=>document.querySelector(s),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let key='',selected=null,record=null,scenarioEditing=false;

async function api(path,method='GET',body){let r=await fetch(path,{method,headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let j=await r.json();if(!r.ok)throw Error(j.error||'Falha');return j}
const msg=t=>$('#feedback').textContent=t;
async function list(){let {campaigns}=await api('/api/admin/campaigns');$('#campaigns').innerHTML=campaigns.map(c=>'<button data-camp="'+safe(c.id)+'">'+safe(c.name)+'</button>').join('');if(selected)await detail();}
async function detail(){let j=await api('/api/admin/campaigns/'+selected);let c=record=j.campaign;
$('#details').innerHTML='<section><h2>'+safe(c.name)+'</h2><p>'+safe(c.sceneName)+' • Rodada '+c.turn+'</p><label>Convite para jogadores</label><input id="invite" readonly value="'+safe(c.invite)+'"><div class="row"><button data-act="copy">Copiar convite</button><button data-act="turn" '+(c.sessionMode==='interlude'?'disabled title="Rodadas pausadas no interlúdio"':'')+'>+ Rodada</button><button data-act="scene">Próxima cena</button><button data-act="sheet">Adicionar ficha JSON</button><button data-act="live">Mesa ao vivo</button></div></section>'
+'<section><h2>Ritmo da campanha</h2><p>'+(c.sessionMode==='interlude'?'✦ Interlúdio: movimento livre, iniciativa pausada.':'⚔ Combate: movimento por iniciativa. Testes sempre livres.')+'</p>'+
'<button data-act="session-mode">'+(c.sessionMode==='interlude'?'Voltar ao combate':'Ativar interlúdio')+'</button></section>'+
'<section><h2>Jogadores na campanha</h2><div class="grid">'+c.players.map(p=>'<article><strong>'+safe(p.nickname)+'</strong> <span class="pill">'+safe(p.status)+'</span>'+(p.proposedSheet?'<p>Ficha enviada para aprovação</p>':'')+'<select data-select="'+safe(p.id)+'"><option value="">Aguardando ficha</option>'+c.characters.map(ch=>'<option value="'+safe(ch.id)+'" '+(p.characterId===ch.id?'selected':'')+'>'+safe(ch.sheet.name)+'</option>').join('')+'</select><div class="row"><button data-act="assign" data-player="'+safe(p.id)+'">Atribuir</button>'+(p.proposedSheet?'<button data-act="approve" data-player="'+safe(p.id)+'">Aprovar enviada</button><button data-act="review" data-player="'+safe(p.id)+'">Revisar</button>':'')+'</div></article>').join('')+'</div></section>'
+'<section><h2>Fichas e efeitos</h2><div class="grid">'+c.characters.map(ch=>'<article><strong>'+safe(ch.sheet.name)+'</strong><div class="row"><button data-act="edit" data-char="'+safe(ch.id)+'">Editar JSON</button><button data-act="effect" data-char="'+safe(ch.id)+'">Aplicar efeito</button></div></article>').join('')+'</div><div id="editor"></div></section>'
+'<section><h2>Canvas privado do mestre</h2><p class="muted">Cartões, posições e objetos armazenados na campanha (JSON). Jogadores não recebem esse conteúdo.</p><textarea id="canvas"></textarea><button data-act="canvas">Salvar canvas</button></section>'+'<section id="scenario-editor" hidden></section>';
$('#canvas').value=JSON.stringify(c.canvas||[],null,2);
}
$('#sign').onclick=async()=>{try{key=$('#key').value.trim();await api('/api/admin/campaigns');$('#login').classList.add('hidden');$('#console').classList.remove('hidden');await list();msg('Acesso autorizado')}catch(e){msg(e.message)}};
$('#create').onclick=async()=>{try{let d=await api('/api/admin/campaigns','POST',{name:$('#new').value});selected=d.id;$('#new').value='';await list();msg('Campanha criada. Compartilhe o convite!')}catch(e){msg(e.message)}};
$('#campaigns').onclick=async e=>{let b=e.target.closest('[data-camp]');if(!b)return;selected=b.dataset.camp;try{await detail()}catch(err){msg(err.message)}};
$('#details').onclick=async e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;try{
let prefix='/api/admin/campaigns/'+selected;
if(a==='copy'){let input=$('#invite');input.select();try{await navigator.clipboard.writeText(input.value);msg('Convite copiado')}catch{msg('Copie o endereço selecionado')}}
if(a==='session-mode'){await api(prefix+'/session-mode','POST',{mode:record.sessionMode==='interlude'?'combat':'interlude'});await detail();msg('Ritmo de sessão atualizado.')}
if(a==='turn'||a==='scene'){await api(prefix+'/advance','POST',{kind:a});await detail()}
if(a==='assign'){let id=b.dataset.player,v=$('[data-select="'+id+'"]').value;await api(prefix+'/assign','POST',{playerId:id,characterId:v||null});await detail()}
if(a==='approve'){await api(prefix+'/approve','POST',{playerId:b.dataset.player});await detail()}
if(a==='review'){let p=record.players.find(x=>x.id===b.dataset.player);let t=document.createElement('textarea');t.readOnly=true;t.value=JSON.stringify(p.proposedSheet,null,2);$('#editor').replaceChildren(t)}
if(a==='sheet'){let t=prompt('Cole a ficha do personagem em JSON');if(t){await api(prefix+'/characters','POST',{sheet:JSON.parse(t)});await detail()}}
if(a==='edit'){let c=record.characters.find(x=>x.id===b.dataset.char);let txt=document.createElement('textarea');txt.id='sheet-json';txt.value=JSON.stringify(c.sheet,null,2);let save=document.createElement('button');save.textContent='Salvar ficha';save.onclick=async()=>{try{await api(prefix+'/characters/'+c.id,'POST',{sheet:JSON.parse(txt.value)});await detail();msg('Ficha atualizada')}catch(err){msg(err.message)}};$('#editor').replaceChildren(txt,save)}
if(a==='effect'){let name=prompt('Nome do efeito');if(name){let unit=prompt('Duração: turn, scene ou permanent','turn');let remaining=unit==='turn'?Number(prompt('Quantos turnos?',3)):null;await api(prefix+'/effects','POST',{characterId:b.dataset.char,name,unit,remaining});await detail()}}
if(a==='canvas'){await api(prefix+'/canvas','POST',{nodes:JSON.parse($('#canvas').value)});msg('Canvas salvo')}
if(a==='live'){
  scenarioEditing=true;window.RPG31_MASTER.open($('#scenario-editor'),{request:api,route:prefix,
    players:record.players,characters:record.characters,
    onClose:()=>{scenarioEditing=false;detail().catch(()=>{})}});
 }
 if(a==='scenario-close'){scenarioEditing=false;await detail()}
}catch(err){msg(err.message)}};
setInterval(()=>{if(key&&selected&&!scenarioEditing&&document.visibilityState==='visible')detail().catch(()=>{})},8000);
</script></html>
