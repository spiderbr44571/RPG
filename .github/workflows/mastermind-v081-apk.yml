name: Mastermind v0.81 APK direto
on:
  push:
    branches:
      - feature/mastermind-v081-modular-rebuild
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configurar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validar motor modular e regressões
        run: |
          set -euo pipefail
          node --check app/src/main/assets/mastermind81_rig.js
          node --check app/src/main/assets/mastermind81_atelier.js
          node --check app/src/main/assets/rpg29_scene_editor.js
          node --check app/src/main/assets/rpg31_master_table.js
          node --check app/src/main/assets/rpg31_player_table.js
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
          node tests/mastermind_v81.test.cjs
      - name: Compilar APK Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Validar conteudo e assinatura do APK
        run: |
          set -euo pipefail
          python3 tests/verify_apk_v81.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
      - name: Publicar artefato da compilacao
        uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.81-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
      - name: Publicar APK direto no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.81-modular-rebuild"
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.81-Android.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.81-Android.apk \
              --target "${GITHUB_SHA}" \
              --title "Mastermind v0.81 — Atelie Modular 2D Reconstruido" \
              --notes "Reconstrucao do atelie 2D com pecas intercambiaveis, rig e ancoras compartilhadas. Corpo, rosto, orelhas, pele, olhos, sobrancelhas, nariz, boca, cabelos, barba, roupas, capas, armaduras, acessorios, cores, fundo e molduras; gera retrato e token salvos na ficha. APK de depuracao."
          else
            gh release upload "$TAG" Mastermind-v0.81-Android.apk --clobber
          fi
