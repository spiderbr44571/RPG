name: Android
# Testes, APK e Release do Android a partir da main. O Release só é criado quando a versão do
# app/build.gradle ainda não foi publicada (subir o versionName = novo Release; nada é sobrescrito).
on:
  push:
    branches: [main, validacao-main]
  pull_request:
    branches: [main, validacao-main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Testes regressivos e compilacao Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Incorporar biblioteca PDF offline (sem CDN em execução)
        run: |
          set -euo pipefail
          npm install --prefix .mm-pdf-deps --no-audit --no-fund --ignore-scripts pdf-lib@1.17.1
          cp .mm-pdf-deps/node_modules/pdf-lib/dist/pdf-lib.min.js app/src/main/assets/pdf-lib.min.js
          test -s app/src/main/assets/pdf-lib.min.js
      - name: Validar sintaxe das funcionalidades adicionadas
        run: |
          set -euo pipefail
          node --check app/src/main/assets/mastermind_coc7_engine.js
          node --check app/src/main/assets/mastermind_coc7_ui.js
          node --check app/src/main/assets/mastermind_sheet_studio.js
          node --check app/src/main/assets/mastermind_system_pdf.js
          node --check app/src/main/assets/mastermind_ordem_template.js
          node --check app/src/main/assets/mastermind_system_editor.js
          node --check app/src/main/assets/mastermind56_local_powers.js
          node --check app/src/main/assets/rpg17_sheet_pdf.js
          node --check app/src/main/assets/mastermind51_private_books.js
          node --check app/src/main/assets/rpg15_catalog.js
          node --check app/src/main/assets/mastermind39_ui.js
          node --check app/src/main/assets/rpg11_campaigns.js
      - name: Testes Android, Ateliê, CoC, PDFs e compatibilidade
        run: |
          set -euo pipefail
          node --check app/src/main/assets/mastermind99_atelier.js
          node --check app/src/main/assets/mastermind99_atelier_layers.js
          node --test tests/mastermind_android.test.cjs tests/mastermind_atelier_camadas.test.cjs tests/mastermind_chocolate_menu.test.cjs tests/mastermind_sheet_studio.test.cjs tests/mastermind_v094_powers.test.cjs
          NODE_PATH="$PWD/.mm-pdf-deps/node_modules" node --test tests/mastermind_v095_pdf_templates.test.cjs tests/mastermind_v096_ordem_template.test.cjs tests/mastermind_v097_system_editor.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Medir encaixe de rostos, olhos, barba, jaleco e vão do braço num Chromium real
        run: |
          set -euo pipefail
          npm install --prefix .mm-e2e --no-audit --no-fund @playwright/test@1.64.1
          NODE_PATH="$PWD/.mm-e2e/node_modules" npx --prefix .mm-e2e playwright install --with-deps chromium
          NODE_PATH="$PWD/.mm-e2e/node_modules" node tests/mastermind_atelie_encaixe.e2e.cjs
      - name: Preparar SDK Android
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK Android assinado de desenvolvimento
        run: gradle :app:assembleDebug --no-daemon
      - name: Conferir assets, pontes nativas e assinatura
        run: |
          set -euo pipefail
          python3 tests/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          NOME=$(sed -n "s/.*versionName '\([0-9]*\.[0-9]*\)\.[0-9]*-\([a-z0-9-]*\)'.*/\1 \2/p" app/build.gradle)
          VERSAO=${NOME%% *}; DESCR=${NOME#* }
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"; echo "DESCR=$DESCR" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "Mastermind-v$VERSAO-Android.apk"
          sha256sum "Mastermind-v$VERSAO-Android.apk" > "Mastermind-v$VERSAO-Android-SHA256.txt"
      - name: Guardar APK no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v${{ env.VERSAO }}-Android-APK
          path: |
            Mastermind-v${{ env.VERSAO }}-Android.apk
            Mastermind-v${{ env.VERSAO }}-Android-SHA256.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publicar Release da versão nova
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v$VERSAO-android-$DESCR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe: nada a publicar (suba o versionName para um Release novo)."
          else
            gh release create "$TAG" "Mastermind-v$VERSAO-Android.apk" "Mastermind-v$VERSAO-Android-SHA256.txt" \
              --target "$GITHUB_SHA" --title "Mastermind Android v$VERSAO" \
              --notes "Mastermind Android v$VERSAO ($DESCR), gerado da main com todos os testes passando. Mesmo applicationId: atualiza sem apagar os dados (faça backup)."
          fi
