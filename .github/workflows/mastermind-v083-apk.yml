name: Mastermind v0.83 Pixel Studio Android
on:
  push:
    branches:
      - feature/mastermind-v083-pixel-cleanroom
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare entirely new original pixel-art assets
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
          python scripts/generate_pixel83.py app/src/main/assets/pixel83
          python scripts/embed_pixel83.py app/src/main/assets/pixel83 app/src/main/assets/mastermind83_atlas.js
      - name: Test independent sprites and the new character builder
        run: |
          set -euo pipefail
          python tests/test_pixel83.py
          node --check app/src/main/assets/mastermind83_atlas.js
          node --check app/src/main/assets/mastermind83_renderer.js
          node --check app/src/main/assets/mastermind83_studio.js
          node tests/mastermind_v83.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify shipped APK and debug signature
        run: |
          set -euo pipefail
          python tests/verify_apk_v83.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.83-PixelStudio-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
      - name: Publish Android APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='mastermind-v0.83-pixel-studio-cleanroom'
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.83-Android.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.83-Android.apk \
              --target "${GITHUB_SHA}" \
              --title 'Mastermind v0.83 — Ateliê Pixel Art Reconstruído' \
              --notes 'Ateliê completamente refeito do zero em pixel art original 192×224. 107 sprites novas intercambiáveis, olhos detalhados, cabelos em camadas, roupas, armaduras, acessórios, paletas, retrato e token com nearest-neighbor. Interface pixel art nova, motor novo, sem editor visual antigo em execução. Integração com fichas e exportação PNG. Build de depuração.'
          else
            gh release upload "$TAG" Mastermind-v0.83-Android.apk --clobber
          fi