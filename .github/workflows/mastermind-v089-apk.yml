name: Mastermind v0.89 — Zoom do Ateliê
on:
  push:
    branches:
      - feature/mastermind-v089-atelier-zoom
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Testar navegação, Godot, zoom e regressão RPG
        run: |
          set -euo pipefail
          node --check app/src/main/assets/pixelportrait86_companion.js
          node tests/pixelportrait86.test.cjs
          node tests/pixelportrait87.test.cjs
          node tests/pixelportrait88.test.cjs
          node tests/pixelportrait89.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Preparar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Validar integridade e assinatura do APK
        run: |
          set -euo pipefail
          python3 tests/verify_apk_v89.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > mastermind-v089-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.89-Atelie-Zoom-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            mastermind-v089-sha256.txt
          if-no-files-found: error
      - name: Publicar APK no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.89-atelier-zoom"
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.89-Android.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.89-Android.apk --target "${GITHUB_SHA}" \
              --title "Mastermind v0.89 — Ateliê com Zoom e Ajuste de Tela" \
              --notes "O editor original Pixel Portrait Creator Godot HTML5 agora abre automaticamente centralizado e ampliado no celular. Controles de zoom +/- com percentual, botão Ajustar, modo Mover com arraste e opção de orientação paisagem/retrato. Captura respeita somente a área visível do editor. Mantém o navegador original como fallback, salva retratos e tokens nas fichas. Não inclui assets proprietárias do lyime. Android debug compilado e assinado. Teste visual no celular recomendado."
          else
            gh release upload "$TAG" Mastermind-v0.89-Android.apk --clobber
          fi
