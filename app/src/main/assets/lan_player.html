  $('#result').classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>$('#result').classList.remove('visible'),4400);
  // O resultado é calculado neste navegador e compartilhado com a campanha para o mestre visualizar.
  fetch('/api/play/'+cid+'/roll',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:label,formula,faces:data.faces.join(','),total:data.total})}).catch(()=>{});
  return data;
 }catch(e){message(e.message);return null}
}
$('#quick-die').onclick=()=>{let d=$('#quick-die');d.classList.remove('roll');void d.offsetWidth;d.classList.add('roll');roll('d20 livre','1d20')};
const itemsOf=s=>Array.isArray(s.inventory)?s.inventory:Array.isArray(s.items)?s.items:[];
function renderAttributes(s){
 $('#attributes').innerHTML='<h3>Recursos e atributos</h3><div class="grid">'+
 ['NEX','Defesa'].map(k=>'<div class="stat"><small>'+k+'</small><strong>'+esc(k==='NEX'?(s.nex||5)+'%':Number(s.defense??s.defesa??(10+attr(s,'Agilidade'))))+'</strong></div>').join('')+
 canonical.map(k=>'<div class="stat"><small>'+k+'</small><strong>'+attr(s,k)+'</strong><button data-attribute="'+k+'">🎲 Testar</button></div>').join('')+'</div><h3 style="margin-top:20px">PV, PE e SAN</h3>'+
 ['PV','PE','SAN'].map(k=>{let v=s.resources?.[k]||{},mx=Number(v.max??0),current=Number(v.current??0),pct=mx?Math.max(0,Math.min(100,current/mx*100)):0;
 return '<div class="meter"><div class="meter-head"><strong>'+k+'</strong><div class="row"><button data-resource="'+k+'" data-step="-1">−</button><span>'+current+' / '+mx+'</span><button data-resource="'+k+'" data-step="1">+</button></div></div><div class="track"><span style="width:'+pct+'%"></span></div></div>'}).join('')+
 '<p class="muted">Os valores máximos e os atributos dependem do mestre. Você pode ajustar seus recursos atuais.</p>';

function renderSkills(s,filter=''){
 const skills=SKILLS.filter(k=>k.name.toLowerCase().includes(filter.toLowerCase()));
 $('#skills').innerHTML='<h3>Perícias</h3><input id="skill-search" placeholder="Pesquisar entre as 28 perícias" value="'+esc(filter)+'" aria-label="Pesquisar perícia"><div id="skill-list">'+skills.map((k,i)=>{
 const value=attr(s,k.attr),bonus=skillGrade(s,k.name);
 return '<div class="item"><div><strong>'+esc(k.name)+'</strong><small>'+esc(k.attr)+' '+value+' · bônus +'+bonus+(k.trained?' · requer treino em usos específicos':'')+'</small></div><button data-skill="'+esc(k.name)+'">🎲 Rolar</button></div>'}).join('')+'</div><p class="muted">Testes de perícia usam vários d20, selecionando o maior (ou menor com atributo 0) e somando o bônus da perícia.</p>';
}
function renderInventory(s){
 const inv=itemsOf(s);
 $('#inventory').innerHTML='<h3>Inventário</h3><p class="muted">Gerencie quantidade e seus próprios itens. As categorias do RPG permanecem separadas.</p>'+
 '<div id="item-list">'+(inv.map((it,i)=>'<div class="item"><div><strong>'+esc(it.nome||it.name||'Item')+'</strong><small>'+esc(String(it.categoriaItem||'geral').replaceAll('_',' '))+' · Qtd '+(it.quantidade??1)+'</small></div><div class="actions">'+'<button data-item-quantity="'+i+'" data-increment="-1">−</button><button data-item-quantity="'+i+'" data-increment="1">+</button></div></div>').join('')||'<p class="muted">Nenhum item registrado.</p>')+'</div>'+
 '<h3 style="margin-top:20px">Adicionar item personalizado</h3><div class="grid"><label class="field"><span>Nome</span><input id="new-item" maxlength="90"></label><label class="field"><span>Categoria</span><select id="new-item-cat"><option value="geral">Geral</option><option value="ferramenta">Ferramenta</option><option value="acessorio">Acessório</option><option value="item_paranormal">Paranormal</option></select></label></div><button class="primary" id="add-item">Adicionar ao inventário</button>';
}
function renderAbilities(s){
 const rituals=(s.rituaisConhecidos||[]).map(id=>RITUALS.find(x=>x.id===id)||RITUALS.find(x=>x.name===id)||{name:id,element:'',circle:'?'});
 const powers=(s.powers||[]).map(x=>typeof x==='string'?x:x?.nome||x?.name||'Habilidade');
 const rolls=s.customRolls||[];
 $('#abilities').innerHTML='<h3>Habilidades</h3>'+ (powers.length?powers.map(x=>'<div class="item"><strong>'+esc(x)+'</strong><small>Consulte suas regras para ativação.</small></div>').join(''):'<p class="muted">Nenhuma registrada.</p>')+
 '<h3 style="margin-top:22px">Rituais conhecidos</h3>'+(rituals.length?rituals.map(x=>'<div class="item"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.element)+' · '+esc(x.circle)+'º círculo'+(x.pe?' · custo-base '+x.pe+' PE':'')+'</small></div></div>').join(''):'<p class="muted">Nenhum registrado.</p>')+
 '<p class="muted">Nem todo ritual exige uma rolagem. Use uma fórmula cadastrada quando o mestre confirmar a mecânica.</p>'+
 '<h3 style="margin-top:22px">Rolagens fixas configuráveis</h3>'+rolls.map((x,i)=>'<div class="item"><div><strong>'+esc(x.label)+'</strong><small>'+esc(x.formula)+'</small></div><div class="actions"><button data-fixed-roll="'+i+'">🎲 Rolar</button><button data-del-roll="'+i+'">Remover</button></div></div>').join('')+
 '<div class="grid"><label class="field"><span>Nome do teste</span><input id="roll-label" placeholder="Ritual, habilidade ou teste" maxlength="64"></label><label class="field"><span>Fórmula validada</span><input id="roll-formula" placeholder="2d8+3" maxlength="32"></label></div><button class="primary" id="add-roll">Salvar rolagem</button>'+
 '<p class="muted">Para aprender poderes de classe e paranormais, use a aba <strong>Poderes & Transcender</strong>.</p>';
 if(s.systemId==='ordem-paranormal'){
   window.MastermindPowerUI?.mountOriginal($('#v55-original-powers'),s);
   $('#tabs [data-tab="powers"]').hidden=false;
 }else{
   $('#powers').innerHTML='<p>Poderes deste sistema ficam na ficha correspondente.</p>';
   $('#tabs [data-tab="powers"]').hidden=true;
   if(tab==='powers')activate('attributes');
 }
}
function renderStory(s){
 $('#story').innerHTML='<h3>História e descrição</h3><p class="muted">Seus textos acompanham a ficha da campanha. O mestre também pode lê-los.</p><label class="field"><span>Descrição do personagem</span><textarea id="description" maxlength="12000">'+esc(s.description||'')+'</textarea></label><label class="field"><span>História</span><textarea id="history" maxlength="12000">'+esc(s.history||'')+'</textarea></label><button id="save-story" class="primary">Salvar história</button>';
}
function renderSettings(){
 $('#settings').innerHTML='<h3>Aparência da sua ficha</h3><p class="muted">Preferências pessoais deste navegador, sem alterar outras fichas.</p>'+
 '<label class="field"><span>Tema</span><select id="theme">'+['base','sangue','conhecimento','energia','morte','medo'].map(k=>'<option value="'+k+'">'+k.charAt(0).toUpperCase()+k.slice(1)+'</option>').join('')+'</select></label>'+
 '<label class="field"><span>Cor do tema Base</span><input type="color" id="color"></label>'+
 '<label class="field"><span>Modo</span><select id="mode"><option value="dark">Escuro</option><option value="light">Claro</option></select></label>'+
 '<label class="field"><span>Texto</span><select id="size"><option value="0.9">Compacto</option><option value="1">Normal</option><option value="1.15">Ampliado</option><option value="1.3">Grande</option></select></label>';
 $('#theme').value=prefs.theme||'base';$('#color').value=/^#[a-f0-9]{6}$/i.test(prefs.color||'')?prefs.color:'#c6a2d6';$('#mode').value=prefs.mode||'dark';$('#size').value=String(prefs.size||1);
 for(const id of ['theme','color','mode','size'])$('#'+id).onchange=saveAppearance;
}
async function post(path,data){
 const r=await fetch('/api/play/'+cid+'/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'});
 const out=await r.json();if(!r.ok)throw Error(out.error||'Erro no servidor');return out;
}
async function saveProfile(data){try{await post('profile',data);message('Alterações salvas na campanha');await refresh(true)}catch(e){message('Não salvo: '+e.message)}}
$('#attributes').onclick=async e=>{
 let a=e.target.closest('[data-attribute]');if(a&&state?.character){let n=attr(state.character,a.dataset.attribute);let count=n===0?2:Math.min(12,n);const suffix='+'+0;await roll('Atributo: '+a.dataset.attribute,count+'d20',n===0?'low':'high');return}
 let b=e.target.closest('[data-resource]');if(!b||!state?.character)return;
 const k=b.dataset.resource,v=state.character.resources?.[k];if(!v)return;
 const current=Math.max(0,Math.min(Number(v.max),Number(v.current)+Number(b.dataset.step)));
 try{await post('resource',{resource:k,current});await refresh(true)}catch(err){message(err.message)}
};
$('#skills').oninput=e=>{if(e.target.id==='skill-search'&&state?.character){const v=e.target.value,pos=e.target.selectionStart;renderSkills(state.character,v);const input=$('#skill-search');input.focus();input.setSelectionRange(pos,pos)}};
$('#skills').onclick=async e=>{
 const b=e.target.closest('[data-skill]');if(!b||!state?.character)return;
 const item=SKILLS.find(x=>x.name===b.dataset.skill);if(!item)return;
 const n=attr(state.character,item.attr),grade=skillGrade(state.character,item.name),count=n===0?2:Math.min(12,n);
 const suffix=grade?'+'+grade:'';
 if(item.trained&&grade===0)message('Alguns usos dessa perícia exigem treinamento; confirme a ação com o mestre.');
 await roll('Perícia: '+item.name,count+'d20'+suffix,n===0?'low':'high');
};
$('#inventory').onclick=async e=>{
 if(!state?.character)return;
 let list=itemsOf(state.character).map(x=>({...x}));
 const qty=e.target.closest('[data-item-quantity]');
 if(qty){let item=list[Number(qty.dataset.itemQuantity)];if(!item)return;item.quantidade=Math.max(0,Math.min(9999,Number(item.quantidade??1)+Number(qty.dataset.increment)));await saveProfile({inventory:list});return}
 if(e.target.closest('#add-item')){
  const name=$('#new-item').value.trim(),cat=$('#new-item-cat').value;
  if(!name)return message('Informe o nome do item');
  list.push({nome:name,categoriaItem:cat,quantidade:1});await saveProfile({inventory:list});
 }
};
$('#abilities').onclick=async e=>{
 if(!state?.character)return;const list=(state.character.customRolls||[]).map(x=>({...x}));
 const b=e.target.closest('[data-fixed-roll]');if(b){let x=list[Number(b.dataset.fixedRoll)];if(x)await roll(x.label,x.formula);return}
 const d=e.target.closest('[data-del-roll]');if(d){list.splice(Number(d.dataset.delRoll),1);await saveProfile({customRolls:list});return}
 if(e.target.closest('#add-roll')){
  let label=$('#roll-label').value.trim(),formula=$('#roll-formula').value.trim();if(!label)return message('Dê nome à rolagem');
  if(!/^([1-9][0-9]?)d(4|6|8|10|12|20|100)([+-]\d{1,3})?$/.test(formula))return message('Use uma fórmula como 2d6+3');
  list.push({label,formula});await saveProfile({customRolls:list});
 }
};
$('#story').onclick=e=>{if(e.target.id==='save-story')saveProfile({description:$('#description').value,history:$('#history').value})};
let dragging=null,panDragging=null,scale=1,pan={x:0,y:0};
function renderCanvas(){
 const e=$('#canvas');if(!e)return;
 e.innerHTML='<h3>Canvas pessoal</h3><p class="muted">Arraste notas pelo espaço infinito. As alterações são guardadas no servidor da sua campanha, mas não aparecem no canvas privado do mestre.</p><div class="row"><button id="add-note" class="primary">+ Nota</button><button id="save-canvas">Salvar canvas</button><button id="zoom-in">Aproximar</button><button id="zoom-out">Afastar</button><span id="zoom-label"></span></div>'+
 '<div class="canvas-viewport" id="canvas-space"><div id="canvas-world" style="transform-origin:0 0;position:absolute;inset:0;transform:translate('+pan.x+'px,'+pan.y+'px) scale('+scale+')">'+canvasNodes.map((n,i)=>'<div class="note-card" data-note="'+i+'" style="left:'+Number(n.x||0)+'px;top:'+Number(n.y||0)+'px"><div class="title" data-drag="'+i+'">'+esc(n.title||'Nova nota')+'</div><p>'+esc(n.text||'')+'</p><button data-edit="'+i+'">Editar</button> <button data-delete="'+i+'">Excluir</button></div>').join('')+'</div></div>';
 $('#zoom-label').textContent=Math.round(scale*100)+'%';
}
$('#canvas').onclick=async e=>{
 if(e.target.closest('#add-note')){let title=prompt('Título da nota','Anotação');if(title===null)return;const vp=$('#canvas-space');const x=((vp?.clientWidth||300)/2-pan.x)/scale,y=((vp?.clientHeight||300)/2-pan.y)/scale;canvasNodes.push({id:'n'+Date.now()+'-'+Math.floor(Math.random()*1000),title:title.slice(0,90),text:'',x,y});renderCanvas()}
 if(e.target.closest('#save-canvas')){try{await post('canvas',{nodes:canvasNodes});message('Canvas sincronizado com o servidor')}catch(err){message(err.message)}}
 if(e.target.closest('#zoom-in')){scale=Math.min(2,scale+.2);renderCanvas()}
 if(e.target.closest('#zoom-out')){scale=Math.max(.4,scale-.2);renderCanvas()}
 let ed=e.target.closest('[data-edit]');if(ed){let x=canvasNodes[Number(ed.dataset.edit)],v=prompt('Conteúdo da nota',x.text);if(v!==null){x.text=v.slice(0,3000);renderCanvas()}}
 let dl=e.target.closest('[data-delete]');if(dl&&confirm('Excluir esta nota?')){canvasNodes.splice(Number(dl.dataset.delete),1);renderCanvas()}
};
$('#canvas').addEventListener('pointerdown',e=>{
 const b=e.target.closest('[data-drag]');
 if(!b){
   const viewport=e.target.closest('#canvas-space');
   if(!viewport||e.target.closest('button'))return;
   panDragging={x:e.clientX,y:e.clientY,ox:pan.x,oy:pan.y};
   viewport.setPointerCapture(e.pointerId);e.preventDefault();return;
 }
 const index=Number(b.dataset.drag),n=canvasNodes[index];if(!n)return;
 dragging={index,x:e.clientX,y:e.clientY,ox:Number(n.x)||0,oy:Number(n.y)||0};
 b.setPointerCapture(e.pointerId);e.preventDefault()
});
$('#canvas').addEventListener('pointermove',e=>{
 if(panDragging){
   pan.x=panDragging.ox+(e.clientX-panDragging.x);pan.y=panDragging.oy+(e.clientY-panDragging.y);
   const world=$('#canvas-world');if(world)world.style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+scale+')';
   return;
 }
 if(!dragging)return;let n=canvasNodes[dragging.index],el=$('[data-note="'+dragging.index+'"]');if(!n||!el)return;
 n.x=Math.max(-100000,Math.min(100000,dragging.ox+(e.clientX-dragging.x)/scale));
 n.y=Math.max(-100000,Math.min(100000,dragging.oy+(e.clientY-dragging.y)/scale));
 el.style.left=n.x+'px';el.style.top=n.y+'px';
});
$('#canvas').addEventListener('pointerup',()=>{dragging=null;panDragging=null});
$('#canvas').addEventListener('pointercancel',()=>{dragging=null;panDragging=null});
async function loadCanvas(){try{let r=await fetch('/api/play/'+cid+'/canvas',{credentials:'same-origin',cache:'no-store'});let out=await r.json();if(r.ok&&Array.isArray(out.nodes)){canvasNodes=out.nodes;if(tab==='canvas')renderCanvas()}}catch{}}
async function refresh(force=false){
 if(networkBusy)return;networkBusy=true;
 try{
  let r=await fetch('/api/play/'+cid+'?t='+Date.now(),{credentials:'same-origin',cache:'no-store'});
  let j=await r.json();if(!r.ok)throw Error(j.error||'Acesso não autorizado');
  const sceneChanged=state&&(state.turn!==j.turn||state.scene!==j.scene);
  if(sceneChanged){$('#rounds').classList.remove('changed');void $('#rounds').offsetWidth;$('#rounds').classList.add('changed')}
  if(j.character?.systemId==='gurps'){location.reload();return}
  state=j;ownLink=j.permalink||'';
  $('#campaign').textContent=j.campaign;$('#connected').textContent='● Sincronizado com mestre';
  $('#scene').textContent=j.sceneName||('Cena '+j.scene);$('#turn').textContent=j.turn;$('#nickname').textContent=j.nickname;$('#short-id').textContent='#'+j.shortId;
  const next=JSON.stringify(j.character||null);
  if(force||next!==signature){
   signature=next;
   const s=j.character;
   if(!s){$('#hero').innerHTML='<h2>Aguardando ficha</h2><p>O mestre deve aprovar ou atribuir seu personagem.</p>';for(const key of ['attributes','skills','inventory','abilities','story'])$('#'+key).innerHTML='<p class="muted">Aguardando personagem...</p>'}
   else{
    let portrait=s.photo&&/^data:image\/(png|jpeg|webp);base64,/.test(s.photo)?'<img src="'+esc(s.photo)+'" alt="Personagem">':'';
    $('#hero').innerHTML='<div class="hero">'+portrait+'<div><div class="eyebrow">'+esc(s.class||'Personagem')+'</div><h2>'+esc(s.name||'Agente')+'</h2><span class="pill">NEX '+esc(s.nex??5)+'%</span></div></div>';
    renderAttributes(s);renderSkills(s);renderInventory(s);renderAbilities(s);if(tab!=='story'||force)renderStory(s);
   }
  }
  message('');
 }catch(e){$('#connected').textContent='● Desconectado, tentando novamente';message(e.message)}
 finally{networkBusy=false}
}
$('#copy-link').onclick=async()=>{if(!ownLink)return message('O link ainda não foi criado');try{await navigator.clipboard.writeText(ownLink);message('Link pessoal copiado')}catch{message('Seu link pessoal: '+ownLink)}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('focus',()=>refresh());
appearance();renderSettings();activate('attributes');loadCanvas();refresh();setInterval(()=>{if(!document.hidden)refresh()},2000);
</script></body></html>
