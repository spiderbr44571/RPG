name: Mastermind 1.1.11 Linux — Rostos e barba encaixados no Ateliê
on:
  push:
    branches:
      - feature/linux-v1111-atelie-encaixe
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb zstd desktop-file-utils
          npm install --no-audit --no-fund
          cp node_modules/pdf-lib/dist/pdf-lib.min.js app/src/main/assets/pdf-lib.min.js
          test -s app/src/main/assets/pdf-lib.min.js
      - name: Compilar servidor de campanhas embutido
        run: bash desktop/server/build.sh
      - name: Validação sintática e testes locais
        run: |
          set -euo pipefail
          node --check desktop/main.cjs
          node --check desktop/mestragem-linux.js
          node --check desktop/renderer.js
          node --check desktop/book-index.cjs
          node --check app/src/main/assets/mastermind_coc7_engine.js
          node --check app/src/main/assets/mastermind_coc7_ui.js
          node --check app/src/main/assets/mastermind_sheet_studio.js
          node --check app/src/main/assets/mastermind_system_pdf.js
          node --check app/src/main/assets/mastermind_ordem_template.js
          node --check app/src/main/assets/mastermind_system_editor.js
          node --check app/src/main/assets/rpg15_catalog.js
          node --check app/src/main/assets/mastermind39_ui.js
          node --check app/src/main/assets/rpg17_sheet_pdf.js
          node --check app/src/main/assets/mastermind56_local_powers.js
          node --check app/src/main/assets/mastermind_sheet_studio.js
          node --check app/src/main/assets/rpg11_campaigns.js
          node --check app/src/main/assets/mastermind99_atelier.js
          node --check app/src/main/assets/mastermind99_atelier_layers.js
          node --test desktop/tests/desktop.test.cjs desktop/tests/godot-health.test.cjs desktop/tests/pdf-coc.test.cjs tests/mastermind_manual_canvas.test.cjs tests/mastermind_atelier_overlay.test.cjs tests/mastermind_sheet_studio.test.cjs tests/mastermind_v094_powers.test.cjs tests/mastermind_v095_pdf_templates.test.cjs tests/mastermind_v096_ordem_template.test.cjs tests/mastermind_v097_system_editor.test.cjs tests/mastermind_chocolate_menu.test.cjs tests/mastermind_atelier_camadas.test.cjs
      - name: Testar servidor, fichas, grid e paisagem em Electron real
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
          MASTERMIND_E2E: '1'
        run: timeout 140s xvfb-run -a -s "-screen 0 1440x900x24" node desktop/tests/e2e-mestragem.cjs
      - name: Compilar AppImage e tar.gz
        run: npx electron-builder --linux AppImage tar.gz --x64 --publish never
      - name: Garantir integridade de TODOS os assets do Ateliê, fichas e livros após otimizar
        run: |
          set -euo pipefail
          diff -qr app/src/main/assets dist/linux-unpacked/resources/server/assets
          test -s dist/linux-unpacked/resources/server/mastermind-campaign-server.jar
          test -s dist/linux-unpacked/resources/app.asar
          du -h dist/linux-unpacked/resources/app.asar
          echo 'PASS: todos os assets e o servidor preservados byte a byte'
      - name: Testar aplicativo Linux empacotado (evita tela escura ERR_FILE_NOT_FOUND)
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: timeout 120s xvfb-run -a -s "-screen 0 1440x900x24" node desktop/tests/e2e-packaged.cjs dist/linux-unpacked/mastermind
      - name: Testar novo Estudio de Fichas no Electron Linux real
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: timeout 140s xvfb-run -a -s "-screen 0 1920x1080x24" node desktop/tests/e2e-sheet-studio.cjs dist/linux-unpacked/mastermind
      - name: Validar pesquisa PDF e investigador CoC 7e no Linux instalado
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: timeout 110s xvfb-run -a -s "-screen 0 1440x900x24" node desktop/tests/e2e-pdf-coc.cjs dist/linux-unpacked/mastermind
      - name: Canvas de campanha - sem linhas pontilhadas automaticas e ligacao manual persistente
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: timeout 100s xvfb-run -a -s "-screen 0 1440x900x24" node desktop/tests/e2e-canvas-manual.cjs dist/linux-unpacked/mastermind
      - name: Testar menu do Atelie e horizontal 1900px em Electron empacotado
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: timeout 120s xvfb-run -a -s "-screen 0 1920x1080x24" node desktop/tests/e2e-atelier-landscape.cjs dist/linux-unpacked/mastermind
      - name: Testar Ateliê em camadas offline e gravação na ficha no Electron empacotado
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: timeout 300s xvfb-run -a -s "-screen 0 1440x900x24" node desktop/tests/e2e-atelier-camadas.cjs dist/linux-unpacked/mastermind
      - name: Criar instalador Arch/CachyOS
        env:
          MASTERMIND_VERSION: '1.1.11'
          MASTERMIND_RELEASE: '1'
        run: |
          set -euo pipefail
          bash scripts/package_arch_linux.sh dist/Mastermind-v1.1.11-Linux-x64.tar.gz dist/
          python3 tests/verify_arch_linux_package.py dist/mastermind-rpg-1.1.11-1-x86_64.pkg.tar.zst
          test -s dist/Mastermind-v1.1.11-Linux-x86_64.AppImage
          test -s dist/mastermind-rpg-1.1.11-1-x86_64.pkg.tar.zst
          sha256sum dist/Mastermind-v1.1.11-Linux-x86_64.AppImage dist/Mastermind-v1.1.11-Linux-x64.tar.gz > dist/SHA256SUMS.txt
      - name: Publicar apenas Pacman (CachyOS/Arch)
        uses: actions/upload-artifact@v4
        with:
          name: Mastermind-1.1.11-Linux-ATELIE-ENCAIXE-Pacman
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/mastermind-rpg-1.1.11-1-x86_64.pkg.tar.zst
            dist/mastermind-rpg-1.1.11-1-x86_64.pkg.tar.zst.sha256
      - name: Publicar AppImage separado (outra distribuicao Linux)
        uses: actions/upload-artifact@v4
        with:
          name: Mastermind-1.1.11-Linux-ATELIE-ENCAIXE-AppImage
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/Mastermind-v1.1.11-Linux-x86_64.AppImage
            dist/SHA256SUMS.txt
      - name: Publicar tar.gz separado (Linux avancado)
        uses: actions/upload-artifact@v4
        with:
          name: Mastermind-1.1.11-Linux-ATELIE-ENCAIXE-TarGz
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/Mastermind-v1.1.11-Linux-x64.tar.gz
            dist/SHA256SUMS.txt

      - name: Publicar pacotes Linux validados no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='mastermind-v1.1.11-linux-atelie-encaixe'
          packages=(dist/mastermind-rpg-1.1.11-1-x86_64.pkg.tar.zst dist/Mastermind-v1.1.11-Linux-x86_64.AppImage dist/Mastermind-v1.1.11-Linux-x64.tar.gz dist/SHA256SUMS.txt)
          for file in "${packages[@]}"; do test -s "$file"; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${packages[@]}" --clobber
          else
            gh release create "$TAG" "${packages[@]}" --target "$GITHUB_SHA" --title 'Mastermind Linux v1.1.11 — Rostos e barba encaixados no Ateliê' --notes 'Build experimental. No Ateliê, o rosto Redondo não mostra mais as linhas do rosto padrão nem cobre a gola da roupa; os olhos do rosto Jovem foram repintados (sem o olho do manequim por baixo); a barba cheia encaixa no rosto, com costeletas até o contorno e a orelha e o queixo no lugar. Testes medem o encaixe em pixels no aplicativo empacotado. Mantém tudo da v1.1.10. Faça backup dos dados.'
          fi
