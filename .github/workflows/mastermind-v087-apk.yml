name: Mastermind v0.87 — Pixel Portrait Creator integrado
on:
  push:
    branches:
      - feature/mastermind-v087-embedded-web-atelier
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validar editor embutido isolado, capture e RPG
        run: |
          set -euo pipefail
          node --check app/src/main/assets/pixelportrait86_companion.js
          node tests/pixelportrait86.test.cjs
          node tests/pixelportrait87.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Preparar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verificar integridade do APK e assinatura Android
        run: |
          set -euo pipefail
          python3 tests/verify_apk_v87.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > mastermind-v087-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.87-PixelPortraitCreator-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            mastermind-v087-sha256.txt
          if-no-files-found: error
      - name: Publicar APK via GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.87-lyime-embedded"
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.87-Android.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.87-Android.apk --target "${GITHUB_SHA}" \
              --title "Mastermind v0.87 — Pixel Portrait Creator dentro do aplicativo" \
              --notes "Ateliê atualizado: abre o Pixel Portrait Creator original de lyime dentro do Mastermind por WebView Android isolado e sem bridges de fichas. Personalização online com opção de captura PixelCopy, recorte, zoom, token, importação e salvamento. Inclui navegador externo alternativo. Não redistribui sprites nem o motor Godot do artista. A versão HTML5 precisa de internet e não exporta PNG nativamente; controles por toque dependem do WebView/aparelho. APK Android debug assinado."
          else
            gh release upload "$TAG" Mastermind-v0.87-Android.apk --clobber
          fi
