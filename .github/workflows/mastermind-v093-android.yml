name: Mastermind Android v0.93 — Estudio de fichas de 4 sistemas
on:
  push:
    branches:
      - feature/android-v093-sheet-studio
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Testes regressivos e compilacao Android v0.93
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validar sintaxe das funcionalidades adicionadas
        run: |
          set -euo pipefail
          node --check app/src/main/assets/mastermind_coc7_engine.js
          node --check app/src/main/assets/mastermind_coc7_ui.js
          node --check app/src/main/assets/mastermind_sheet_studio.js
          node --check app/src/main/assets/mastermind51_private_books.js
          node --check app/src/main/assets/rpg15_catalog.js
          node --check app/src/main/assets/rpg11_campaigns.js
      - name: Testes Android, CoC, PDFs, Godot e compatibilidade
        run: |
          set -euo pipefail
          node --test tests/mastermind_v093_android.test.cjs
          node tests/pixelportrait90.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Preparar SDK Android
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK Android assinado de desenvolvimento
        run: gradle :app:assembleDebug --no-daemon
      - name: Conferir assets, pontes nativas e assinatura
        run: |
          set -euo pipefail
          python3 tests/verify_apk_v93.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.93-Android-Sheet-Studio.apk
          sha256sum Mastermind-v0.93-Android-Sheet-Studio.apk > Mastermind-v0.93-Android-SHA256.txt
      - name: Publicar APK no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.93-Android-Fichas-4-Sistemas-APK
          path: |
            Mastermind-v0.93-Android-Sheet-Studio.apk
            Mastermind-v0.93-Android-SHA256.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publicar APK para download direto no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.93-android-sheet-studio"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Mastermind-v0.93-Android-Sheet-Studio.apk Mastermind-v0.93-Android-SHA256.txt --clobber
          else
            gh release create "$TAG" Mastermind-v0.93-Android-Sheet-Studio.apk Mastermind-v0.93-Android-SHA256.txt \
              --target "$GITHUB_SHA" --title "Mastermind Android v0.93 — PDFs e Chamado de Cthulhu" \
              --notes "APK Android v0.93 experimental, com estúdio unificado de fichas de Ordem, D&D, GURPS e Cthulhu, temas personalizados, animações acessíveis e leitor e indexador local de PDFs pessoais por sistema, Chamado de Cthulhu 7e (fichas, rolagens d100 e integração de campanha), exportação JSON no seletor nativo Android, e interface adaptada ao toque. Preserva as funcionalidades anteriores (Ordem Paranormal, D&D, GURPS, mesa, canvas e Ateliê Godot). Os livros comerciais não são distribuídos. Builds de desenvolvimento podem ser assinadas por chave diferente das versões antigas: faça backup de personagens e PDFs antes de qualquer desinstalação."
          fi
