name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilacao Android (diagnostico)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          java -version

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK com registro de erros
        shell: bash
        run: |
          set -o pipefail
          gradle --version
          gradle :app:assembleDebug --stacktrace --warning-mode all --no-daemon 2>&1 | tee build-log.txt

      - name: Upload de log para diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilacao-android
          path: build-log.txt
          if-no-files-found: ignore

      - name: Publicar APK debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-mesa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
