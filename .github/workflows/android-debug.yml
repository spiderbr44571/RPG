name: Compilar APK Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilar aplicativo Android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu-hosted runners already include Android SDK command-line tools.
      # Do not use android-actions/setup-android@v3, which currently calls
      # the removed legacy "tools" package and fails before Gradle runs.
      - name: Preparar Android SDK do runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          command -v sdkmanager || true
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK nao disponivel no runner" >&2
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager ausente" >&2
            exit 1
          fi
          echo "Utilizando $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validar dados e scripts offline
        shell: bash
        run: |
          node --check app/src/main/assets/rpg06.js
          node --check app/src/main/assets/rpg08.js
          node --check app/src/main/assets/rpg09.js
          node --check app/src/main/assets/rpg11_campaigns.js
          node --check app/src/main/assets/rpg14_sheet_tabs.js
          node --check app/src/main/assets/rpg15_catalog_data.js
          node --check app/src/main/assets/rpg15_catalog.js
          node --check app/src/main/assets/rpg15_theme_fix.js
          node --check app/src/main/assets/rpg16_gurps_engine.js
          node --check app/src/main/assets/rpg16_gurps_ui.js
          node --check app/src/main/assets/rpg17_sheet_pdf.js
          node tests/sheet_pdf.test.cjs
          node --check app/src/main/assets/rpg18_dnd_engine.js
          node --check app/src/main/assets/rpg18_dnd_ui.js
          node --check app/src/main/assets/rpg18_bestiary.js
          node tests/dnd5e.test.cjs
          node --check app/src/main/assets/rpg19_order_creatures.js
          node tests/bestiary_multisystem.test.cjs
          node --check app/src/main/assets/rpg20_search_core.js
          node tests/multisystem_search.test.cjs
          node --check app/src/main/assets/rpg26_local_answers.js
          node --check app/src/main/assets/rpg26_offline_search_ui.js
          node tests/local_answer.test.cjs
          node --check app/src/main/assets/rpg27_answer_templates.js
          node tests/structured_offline_answer.test.cjs
          node --check app/src/main/assets/rpg29_scene_editor.js
          node tests/scenario_v29.test.cjs
          node tests/scenario_v30.test.cjs
          node --check app/src/main/assets/rpg31_player_table.js
          node --check app/src/main/assets/rpg31_master_table.js
          node tests/scenario_v31.test.cjs
          node tests/scenario_v32.test.cjs
          node --check app/src/main/assets/rpg33_camera.js
          node tests/scenario_v33.test.cjs
          node tests/scenario_v34.test.cjs
          node tests/scenario_v35.test.cjs
          node tests/scenario_v36.test.cjs
          node --check app/src/main/assets/rpg37_rules.js
          node tests/scenario_v37.test.cjs
          node --check app/src/main/assets/mastermind38_shell.js
          node tests/mastermind_v38.test.cjs
          node --check app/src/main/assets/mastermind39_ui.js
          node tests/mastermind_v39.test.cjs
          node --check app/src/main/assets/mastermind40_canvas_images.js
          node tests/mastermind_v40.test.cjs
          node tests/mastermind_v41.test.cjs
          node --check app/src/main/assets/mastermind42_workspace.js
          node tests/mastermind_v42.test.cjs
          node tests/mastermind_v43.test.cjs
          node tests/mastermind_v44.test.cjs
          node tests/mastermind_v45.test.cjs
          node tests/mastermind_v46.test.cjs
          node tests/mastermind_v47.test.cjs
          node tests/mastermind_v48.test.cjs
          node tests/mastermind_v49.test.cjs
          node --check app/src/main/assets/rpg28_context_search.js
          node tests/contextual_offline_search.test.cjs
          python3 -m py_compile scripts/indexar_pdf.py
          python3 - <<'PY'
          from html.parser import HTMLParser
          import pathlib, tempfile, subprocess
          class InlineScripts(HTMLParser):
              def __init__(self): super().__init__(); self.inline=False; self.blocks=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script': self.inline=not dict(attrs).get('src') and dict(attrs).get('type','text/javascript') in ('text/javascript','application/javascript'); self.blocks.append('') if self.inline else None
              def handle_endtag(self, tag):
                  if tag == 'script': self.inline=False
              def handle_data(self, data):
                  if self.inline and self.blocks: self.blocks[-1]+=data
          parser=InlineScripts(); parser.feed(pathlib.Path('app/src/main/assets/demo-offline.html').read_text())
          for i,code in enumerate(parser.blocks):
              if code.strip():
                  path=pathlib.Path(tempfile.gettempdir())/f'rpg-inline-{i}.js';path.write_text(code)
                  subprocess.run(['node','--check',str(path)],check=True)
          print('Validated',len(parser.blocks),'inline script blocks')
          PY
          node tests/gurps4.test.cjs
          python -m py_compile server/mesa_lan.py
          python - <<'PY'
          import re,json,pathlib
          html=pathlib.Path('app/src/main/assets/demo-offline.html').read_text()
          data=json.loads(re.search(r'<script id="op-pack-json" type="application/json">(.*?)</script>',html,re.S).group(1))
          items=data['equipamentos']
          assert len(items['armas'])==34
          assert len(items['gerais'])==52
          assert len(set((x['nome'],x['categoriaItem']) for x in items['gerais']))==52
          assert all('categoriaBase' in x and 'valorCategoriaPendente' not in x for x in items['gerais'])
          assert len(items['modificacoes'])>=23
          assert 'rpg26_offline_search_ui.js' in html
          assert 'window.RPG101=' in html
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert scripts
          search=pathlib.Path('app/src/main/assets/rpg26_offline_search_ui.js').read_text()
          assert 'window.RPG11=' in search
          pathlib.Path('/tmp/rpg11-embedded.js').write_text(search,encoding='utf-8')
          print('VALIDAÇÃO OK: dados e pesquisa local v0.26')
          PY
          node --check /tmp/rpg11-embedded.js
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('app/src/main/assets')
          html=(root/'demo-offline.html').read_text(encoding='utf-8')
          for filename in ['lan_join.html','lan_player.html','lan_master.html','lan_gurps.html','lan_scene.html']:
              raw=(root/filename).read_text(encoding='utf-8')
              scripts=re.findall(r'<script>(.*?)</script>',raw,re.S)
              assert len(scripts)==1,filename
              Path('/tmp/'+filename+'.js').write_text(scripts[0],encoding='utf-8')
          master=(root/'rpg11_campaigns.js').read_text(encoding='utf-8')
          player=(root/'lan_player.html').read_text(encoding='utf-8')
          server=Path('app/src/main/java/dev/rpgmesa/demo/LocalCampaignServer.java').read_text(encoding='utf-8')
          assert 'openRemoteSheet(char)' in master and "Salvar na campanha" in master
          assert "sceneName" in player and 'visibilitychange' in player
          assert 'permalink' in server and '/resume/' in server
          assert 'playerId' in master and "RpgLocalHost" in master
          assert 'id="skills"' in player and 'id="inventory"' in player
          assert 'id="canvas"' in player and 'id="story"' in player
          assert 'rollFormula' in player and 'SKILLS=' in player
          assert "rpg14_sheet_tabs.js" in html
          assert 'savePlayerCanvas' in server and 'playerProfile' in server
          assert 'sanitizeAttributes' in server
          catalog=__import__('json').loads((root/'rpg_system_catalog.json').read_text(encoding='utf-8'))
          assert len(catalog['systems'])==39
          assert sum(len(s['books']) for s in catalog['systems'])>=200
          assert 'rpg15_catalog.js' in html and 'rpg15_theme_fix.js' in html
          assert 'Bibliotecas de<br>' not in html and 'Referências consultadas' not in html
          assert (root/'rpg15_catalog.css').stat().st_size>1000
          assert 'rpg16_gurps_engine.js' in html and 'rpg16_gurps_ui.js' in html
          assert (root/'rpg16_gurps.css').stat().st_size>2000
          assert 'RPG16_GURPS.mount' in (root/'rpg15_catalog.js').read_text(encoding='utf-8')
          assert 'editRemote' in (root/'rpg16_gurps_ui.js').read_text(encoding='utf-8')
          assert 'Adicionar ficha GURPS' in (root/'rpg11_campaigns.js').read_text(encoding='utf-8')
          assert 'lan_gurps.html' in server
          assert 'currentHP' in server and 'currentFP' in server
          assert 'data-roll' in (root/'lan_gurps.html').read_text(encoding='utf-8')
          assert '"id":"gurps"' in (root/'rpg15_catalog_data.js').read_text(encoding='utf-8')
          assert 'Mesa em rede' not in (root/'rpg09.js').read_text(encoding='utf-8')
          print('VALIDAÇÃO OK: ficha visual, link permanente e atualizacoes LAN')
          PY
          for file in /tmp/lan_join.html.js /tmp/lan_player.html.js /tmp/lan_master.html.js /tmp/lan_gurps.html.js; do node --check "$file"; done

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-log.txt

      - name: Publicar log de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilacao
          path: build-log.txt
          if-no-files-found: ignore

      - name: Publicar APK debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-mesa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Empacotar código-fonte do projeto
        if: success()
        shell: bash
        run: |
          mkdir -p release
          zip -q -r release/RPG-Mesa-v0.16-Codigo-Fonte.zip \
            .github app/src app/build.gradle README.md \
            build.gradle gradle.properties settings.gradle \
            docs server systems tests \
            -x '*/__pycache__/*' '*/.DS_Store' '*/.gradle/*'
          unzip -t release/RPG-Mesa-v0.16-Codigo-Fonte.zip | tail -1

      - name: Publicar código-fonte completo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-mesa-v016-fonte
          path: release/RPG-Mesa-v0.16-Codigo-Fonte.zip
          if-no-files-found: error
