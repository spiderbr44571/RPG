<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar na campanha</title><style>
:root{--bg:#0c0e16;--panel:#1c1c28;--line:#574d57;--accent:#dca4bd;--fg:#f1e8e3;--muted:#afa1b0}
*{box-sizing:border-box}body{background:radial-gradient(circle at 85% 0,#54203644,transparent 45%),var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;margin:0;padding:18px}main{max-width:1050px;margin:0 auto}h1,h2,h3{font-family:Georgia,serif;font-weight:normal;color:#f3c8dc}h1{font-size:32px}.muted,small{color:var(--muted)}section,article{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:16px;margin:13px 0}label{display:block;margin:10px 0 5px}input,select,textarea,button{font:inherit;max-width:100%;border-radius:9px;border:1px solid #6b596c;background:#10121b;color:var(--fg);padding:10px;min-height:42px}input[type=text],input[type=password],textarea{width:100%}textarea{min-height:145px;resize:vertical;font-family:monospace}button{cursor:pointer}button.primary{background:#834267;color:white;border-color:#e4a2c6}button.danger{background:#3a1c24;color:#ffb6bd}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.grid article{margin:0}.status{border-left:3px solid var(--accent);padding:10px;background:#17141f;border-radius:6px}a{color:#efb6d3}.pill{display:inline-block;border-radius:99px;border:1px solid #8d6785;padding:4px 10px;font-size:11px}code{word-break:break-all}.res{display:flex;align-items:center;gap:8px;margin:13px 0}.res strong{min-width:65px}.res button{min-width:44px}.res span{min-width:75px;text-align:center}.portrait{width:76px;height:76px;object-fit:cover;border-radius:10px}.head{display:flex;gap:16px;align-items:center}.hidden{display:none!important}@media(max-width:540px){body{padding:12px}.grid{grid-template-columns:1fr}}
</style><main><h1>✧ Convite para a mesa</h1><p class="muted" id="campaign">Carregando campanha...</p><section><h2>Seu acesso</h2><p>O nickname identifica você, não o personagem. Você pode entrar com sua própria ficha ou aguardar o mestre.</p><label>Nickname</label><input type="text" id="nick" placeholder="Como quer aparecer?" maxlength="40">
<label><input type="radio" name="choice" value="wait" checked> Esperar o mestre atribuir uma ficha</label>
<label><input type="radio" name="choice" value="own"> Enviar minha ficha para aprovação</label>
<div id="own" class="hidden"><label>Selecionar sua ficha JSON</label><input id="file" type="file" accept=".json,application/json"></div>
<button class="primary" id="join">Entrar na campanha</button></section><p id="message" role="status"></p></main>
<script>
'use strict';const $=s=>document.querySelector(s),parts=location.pathname.split('/'),id=parts[2],invite=parts[3];let proposed=null;
fetch('/api/join/info/'+id).then(r=>r.json()).then(j=>$('#campaign').textContent='Campanha: '+(j.name||'')).catch(()=>{});
document.querySelectorAll('[name=choice]').forEach(r=>r.onchange=()=>$('#own').classList.toggle('hidden',document.querySelector('[name=choice]:checked').value!=='own'));
$('#file').onchange=async e=>{try{let f=e.target.files[0];if(!f||f.size>240000)throw Error('Arquivo inválido ou grande demais');proposed=JSON.parse(await f.text());if(!proposed||typeof proposed!=='object')throw Error('JSON inválido');$('#message').textContent='Ficha carregada: '+(proposed.name||'personagem')}catch(err){proposed=null;$('#message').textContent=err.message}};
$('#join').onclick=async()=>{try{let nick=$('#nick').value.trim();if(!nick)throw Error('Informe um nickname');let own=document.querySelector('[name=choice]:checked').value==='own';if(own&&!proposed)throw Error('Selecione sua ficha JSON');let r=await fetch('/api/join/'+id+'/'+invite,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nickname:nick,sheet:own?proposed:null})});let d=await r.json();if(!r.ok)throw Error(d.error||'Erro');location.replace(new URL(d.permalink).pathname)}catch(e){$('#message').textContent=e.message}};
</script></html>
