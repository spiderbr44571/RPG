name: Mastermind v1.0.2 — Corrigir Mestragem e Ateliê Linux
on:
  push:
    branches:
      - fix/mastermind-v102-linux-mestragem-atelie
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar dependências de build e testes Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb zstd desktop-file-utils
          npm install --no-audit --no-fund
      - name: Compilar motor de campanhas Android nativo para Linux
        run: bash desktop/server/build.sh
      - name: Testes unitários do desktop, bridge e motor de mestragem
        run: |
          set -euo pipefail
          node --check desktop/main.cjs
          node --check desktop/campaign-host.cjs
          node --check desktop/renderer.js
          node --check desktop/preload.cjs
          node --check app/src/main/assets/rpg11_campaigns.js
          node --test desktop/tests/desktop.test.cjs
      - name: Testar telas reais, servidor, persistência do canvas e Godot
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
          MASTERMIND_E2E: '1'
        run: timeout 125s xvfb-run -a -s "-screen 0 1440x900x24" node desktop/tests/e2e-linux.cjs
      - name: Gerar executáveis Linux AppImage e tar.gz
        run: npx electron-builder --linux AppImage tar.gz --x64 --publish never
      - name: Confirmar motor do servidor e arquivos nativos na distribuição
        run: |
          set -euo pipefail
          test -f dist/Mastermind-v1.0.2-Linux-x86_64.AppImage
          test -f dist/Mastermind-v1.0.2-Linux-x64.tar.gz
          tar -tzf dist/Mastermind-v1.0.2-Linux-x64.tar.gz | grep -q 'resources/server/mastermind-campaign-server.jar'
          tar -tzf dist/Mastermind-v1.0.2-Linux-x64.tar.gz | grep -q 'resources/server/assets/lan_master.html'
          test "$(stat -c %s dist/Mastermind-v1.0.2-Linux-x86_64.AppImage)" -gt 60000000
      - name: Gerar instalador pacman CachyOS com servidor embutido
        env:
          MASTERMIND_VERSION: '1.0.2'
          MASTERMIND_RELEASE: '1'
        run: |
          set -euo pipefail
          bash scripts/package_arch_linux.sh dist/Mastermind-v1.0.2-Linux-x64.tar.gz dist/
          python3 tests/verify_arch_linux_package.py dist/mastermind-rpg-1.0.2-1-x86_64.pkg.tar.zst
          sha256sum dist/Mastermind-v1.0.2-Linux-x86_64.AppImage dist/Mastermind-v1.0.2-Linux-x64.tar.gz > dist/SHA256SUMS.txt
      - name: Testar pacote com pacman do Arch Linux
        run: |
          docker run --rm -v "$PWD/dist:/install:ro" archlinux:latest bash -euo pipefail -c '
            pacman -Qip /install/mastermind-rpg-1.0.2-1-x86_64.pkg.tar.zst
            pacman -U --noconfirm -dd /install/mastermind-rpg-1.0.2-1-x86_64.pkg.tar.zst
            pacman -Q mastermind-rpg
            test -x /usr/bin/mastermind
            test -x /opt/mastermind/mastermind
            test -s /opt/mastermind/resources/server/mastermind-campaign-server.jar
            test -s /opt/mastermind/resources/server/assets/lan_master.html
            test -s /usr/share/applications/mastermind.desktop
            pacman -Rns --noconfirm -dd mastermind-rpg
            echo "PASS: instalador Linux com servidor de campanhas validado"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v1.0.2-Linux-Mestragem-Atelie
          path: |
            dist/Mastermind-v1.0.2-Linux-x86_64.AppImage
            dist/Mastermind-v1.0.2-Linux-x64.tar.gz
            dist/mastermind-rpg-1.0.2-1-x86_64.pkg.tar.zst
            dist/mastermind-rpg-1.0.2-1-x86_64.pkg.tar.zst.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publicar instalador e atualização Linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v1.0.2-linux-fix"
          FILES=(
            dist/Mastermind-v1.0.2-Linux-x86_64.AppImage
            dist/Mastermind-v1.0.2-Linux-x64.tar.gz
            dist/mastermind-rpg-1.0.2-1-x86_64.pkg.tar.zst
            dist/mastermind-rpg-1.0.2-1-x86_64.pkg.tar.zst.sha256
            dist/SHA256SUMS.txt
          )
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${FILES[@]}" --target "${GITHUB_SHA}" \
              --title "Mastermind v1.0.2 — Linux: mestragem e Ateliê corrigidos" \
              --notes "Instale ou atualize no CachyOS com: sudo pacman -U ./mastermind-rpg-1.0.2-1-x86_64.pkg.tar.zst. Corrigido bug IPC entre telas #master/#atelier85 que impedia Godot e servidor. Mestragem agora usa o motor Java completo da versão Android no PC (fichas, mesa LAN, cenários, canvas, jogadores e convites). Ateliê carrega o Godot original diretamente no painel, com mensagens de erro e novo enquadramento. Inclui Java17 e assets da LAN como dependência e recursos do pacote. Testado em Electron real/Xvfb e com pacman. Ainda recomendamos conferência de vídeo/áudio/accel. NVIDIA no CachyOS."
          else
            gh release upload "$TAG" "${FILES[@]}" --clobber
          fi
