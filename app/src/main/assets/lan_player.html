<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha do jogador</title><style>
:root{--bg:#0c0e16;--panel:#1c1c28;--line:#574d57;--accent:#dca4bd;--fg:#f1e8e3;--muted:#afa1b0}
*{box-sizing:border-box}body{background:radial-gradient(circle at 85% 0,#54203644,transparent 45%),var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;margin:0;padding:18px}main{max-width:1050px;margin:0 auto}h1,h2,h3{font-family:Georgia,serif;font-weight:normal;color:#f3c8dc}h1{font-size:32px}.muted,small{color:var(--muted)}section,article{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:16px;margin:13px 0}label{display:block;margin:10px 0 5px}input,select,textarea,button{font:inherit;max-width:100%;border-radius:9px;border:1px solid #6b596c;background:#10121b;color:var(--fg);padding:10px;min-height:42px}input[type=text],input[type=password],textarea{width:100%}textarea{min-height:145px;resize:vertical;font-family:monospace}button{cursor:pointer}button.primary{background:#834267;color:white;border-color:#e4a2c6}button.danger{background:#3a1c24;color:#ffb6bd}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.grid article{margin:0}.status{border-left:3px solid var(--accent);padding:10px;background:#17141f;border-radius:6px}a{color:#efb6d3}.pill{display:inline-block;border-radius:99px;border:1px solid #8d6785;padding:4px 10px;font-size:11px}code{word-break:break-all}.res{display:flex;align-items:center;gap:8px;margin:13px 0}.res strong{min-width:65px}.res button{min-width:44px}.res span{min-width:75px;text-align:center}.portrait{width:76px;height:76px;object-fit:cover;border-radius:10px}.head{display:flex;gap:16px;align-items:center}.hidden{display:none!important}@media(max-width:540px){body{padding:12px}.grid{grid-template-columns:1fr}}
</style><main><header><h1>✧ Minha campanha</h1><p class="muted" id="header">Sincronizando com o mestre...</p></header><section id="sheet"><p>Carregando...</p></section><p id="feedback" role="status"></p></main>
<script>
'use strict';const $=s=>document.querySelector(s),id=location.pathname.split('/')[2],esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null;
async function refresh(){try{let r=await fetch('/api/play/'+id,{cache:'no-store'});let d=await r.json();if(!r.ok)throw Error(d.error||'Sessão expirada');$('#header').textContent=d.campaign+' • '+d.sceneName+' • Rodada '+d.turn+' • '+d.nickname;if(!d.character){current=null;$('#sheet').innerHTML='<h2>Aguardando o mestre</h2><p>Sua entrada foi registrada. O mestre pode aprovar sua ficha ou atribuir outra.</p>';return}current=d.character;let s=current;let photo=s.photo&&/^data:image\/(png|jpeg|webp);base64,/.test(s.photo)?'<img class="portrait" alt="Personagem" src="'+esc(s.photo)+'">':'';$('#sheet').innerHTML='<div class="head">'+photo+'<div><h2>'+esc(s.name)+'</h2><small>'+esc(s.class||'')+' · NEX '+esc(s.nex??5)+'%</small></div></div><hr><h3>Recursos atuais</h3>'+Object.entries(s.resources||{}).filter(([k,v])=>['PV','PE','SAN'].includes(k)&&v&&typeof v==='object').map(([k,v])=>'<div class="res"><strong>'+esc(k)+'</strong><button data-resource="'+esc(k)+'" data-delta="-1">−</button><span>'+Number(v.current)+' / '+Number(v.max)+'</span><button data-resource="'+esc(k)+'" data-delta="1">+</button></div>').join('')+'<h3>Atributos</h3><p>'+Object.entries(s.attrs||{}).map(([k,v])=>esc(k)+': '+esc(v)).join(' · ')+'</p><h3>Rituais conhecidos</h3><p>'+esc((s.rituaisConhecidos||[]).join(', ')||'Nenhum')+'</p><h3>Efeitos</h3>'+((s.effects||[]).map(e=>'<p>'+esc(e.name)+' · '+esc(e.unit)+(e.remaining?' · '+e.remaining+' turnos':'')+'</p>').join('')||'<p>Nenhum efeito ativo</p>')}catch(e){$('#feedback').textContent=e.message}}
$('#sheet').onclick=async e=>{let b=e.target.closest('[data-resource]');if(!b||!current)return;let k=b.dataset.resource,res=current.resources[k],currentValue=Number(res.current)+Number(b.dataset.delta);currentValue=Math.min(Number(res.max),Math.max(0,currentValue));try{let r=await fetch('/api/play/'+id+'/resource',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource:k,current:currentValue})});let d=await r.json();if(!r.ok)throw Error(d.error||'Erro');await refresh()}catch(err){$('#feedback').textContent=err.message}};
refresh();setInterval(()=>{if(document.visibilityState==='visible')refresh()},2000);
</script></html>
