name: Mastermind v0.90 — Ateliê direto na tela
on:
  push:
    branches:
      - feature/mastermind-v090-inline-atelier
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Testar Godot direto, editor incorporado, fichas e RPG
        run: |
          set -euo pipefail
          node --check app/src/main/assets/pixelportrait86_companion.js
          node tests/pixelportrait90.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Preparar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Validar conteúdo e assinatura do APK
        run: |
          set -euo pipefail
          python3 tests/verify_apk_v90.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > mastermind-v090-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.90-Atelie-Inline-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            mastermind-v090-sha256.txt
          if-no-files-found: error
      - name: Publicar APK no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.90-atelier-inline"
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.90-Android.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.90-Android.apk --target "${GITHUB_SHA}" \
              --title "Mastermind v0.90 — Pixel Portrait Creator direto no Ateliê" \
              --notes "Agora basta abrir Casinha → Ateliê: o jogo original Godot do lyime carrega automaticamente no painel do Mastermind, sem botão intermediário ou janela separada. Visualização adaptada ao celular, zoom e ajuste, captura local para ficha/token, rolagem integrada e WebView remota isolada sem bridges. Preserva personagens existentes; sem redistribuir assets do artista. Requer internet. APK Android assinado. Validação visual no aparelho ainda é recomendada."
          else
            gh release upload "$TAG" Mastermind-v0.90-Android.apk --clobber
          fi
