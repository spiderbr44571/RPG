name: Mastermind v0.88 — Godot HTML5 direto do lyime
on:
  push:
    branches:
      - feature/mastermind-v088-direct-godot-embed
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validar código Godot direto, segurança e fichas
        run: |
          set -euo pipefail
          node --check app/src/main/assets/pixelportrait86_companion.js
          node tests/pixelportrait86.test.cjs
          node tests/pixelportrait87.test.cjs
          node tests/pixelportrait88.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Preparar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Validar APK e assinatura
        run: |
          set -euo pipefail
          python3 tests/verify_apk_v88.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > mastermind-v088-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.88-GodotDirect-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            mastermind-v088-sha256.txt
          if-no-files-found: error
      - name: Publicar APK via GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.88-lyime-godot-direct"
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.88-Android.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.88-Android.apk --target "${GITHUB_SHA}" \
              --title "Mastermind v0.88 — Pixel Portrait Creator Godot HTML5 direto" \
              --notes "Ateliê conecta diretamente ao index.html original do Godot HTML5 publicado pelo lyime (via html.itch.zone), conforme inspeção real do HTML do itch.io. Descobre atualizações do URL no lançamento, mantém WebView isolada, botão de recarga, navegador alternativo, captura local para a ficha, recorte e token. Sem redistribuir executáveis, WASM ou sprites originais. Exige internet. Compilação e verificações automatizadas; compatibilidade no Android real precisa ser testada."
          else
            gh release upload "$TAG" Mastermind-v0.88-Android.apk --clobber
          fi
