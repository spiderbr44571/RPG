name: Mastermind v0.84 — Sem Ateliê
on:
  push:
    branches:
      - chore/mastermind-v084-remove-atelier
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validar remocao do editor antigo e funcoes existentes
        run: |
          set -euo pipefail
          node tests/mastermind_v84.test.cjs
          node tests/gurps4.test.cjs
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Configurar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Validar APK e assinatura
        run: |
          set -euo pipefail
          python3 tests/verify_apk_v84.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.84-sem-atelie-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK de remocao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.84-sem-atelie"
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.84-sem-atelie.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.84-sem-atelie.apk --target "${GITHUB_SHA}" \
              --title "Mastermind v0.84 — Ateliê removido" \
              --notes "Removido o ateliê de personagens anterior por completo: interface, navegação, renderizadores e sprites geradas por IA. Preservadas fichas, imagens de personagem, tokens existentes e demais recursos do RPG. Próxima fase: planejar novo editor com assets licenciadas de terceiros. Build debug."
          else
            gh release upload "$TAG" Mastermind-v0.84-sem-atelie.apk --clobber
          fi
