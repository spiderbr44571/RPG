name: Mastermind v0.75 APK direto
on:
  push:
    branches:
      - fix/mastermind-v075-lit-rooms-analog-rotation
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configurar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validar scripts e dados GURPS
        run: |
          node --check app/src/main/assets/rpg16_gurps_ui.js
          node --check app/src/main/assets/rpg16_gurps_traits.js
          node --check app/src/main/assets/mastermind62_descriptions.js
          node --check app/src/main/assets/mastermind63_gurps_summaries.js
          node --check app/src/main/assets/mastermind63_gurps_skill_pt.js
          node --check app/src/main/assets/mastermind63_srd_summaries.js
          node --check app/src/main/assets/mastermind63_order_summaries.js
          node --check app/src/main/assets/mastermind56_local_powers.js
          node --check app/src/main/assets/rpg18_dnd_ui.js
          node tests/gurps4.test.cjs
          node tests/mastermind_v61.test.cjs
          node tests/mastermind_v60.test.cjs
          node tests/mastermind_v62.test.cjs
          node tests/mastermind_v63.test.cjs
          node --check app/src/main/assets/rpg31_master_table.js
          node tests/mastermind_v64.test.cjs
          node tests/mastermind_v65.test.cjs
          node --check app/src/main/assets/mastermind66_spells.js
          node --check app/src/main/assets/mastermind66_grimoire_engine.js
          node --check app/src/main/assets/mastermind66_grimoire_ui.js
          node tests/mastermind_v66.test.cjs
          node --check app/src/main/assets/mastermind68_map_layers.js
          node --check app/src/main/assets/rpg29_scene_editor.js
          node --check app/src/main/assets/rpg31_master_table.js
          node --check app/src/main/assets/rpg31_player_table.js
          node tests/mastermind_v68.test.cjs
          node --check app/src/main/assets/mastermind69_atmosphere.js
          node --check app/src/main/assets/rpg29_scene_editor.js
          node --check app/src/main/assets/rpg31_master_table.js
          node --check app/src/main/assets/rpg31_player_table.js
          node --check app/src/main/assets/mastermind72_volume.js
          node tests/mastermind_v72.test.cjs
          node tests/mastermind_v73.test.cjs
          node --check app/src/main/assets/mastermind74_icons.js
          node tests/mastermind_v74.test.cjs
          node tests/mastermind_v75.test.cjs
      - name: Compilar APK Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Validar APK e assinatura
        run: |
          python3 tests/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
      - name: Publicar Mastermind v0.75 APK
        uses: actions/upload-artifact@v4
        with:
          name: Mastermind-v0.75-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error

      - name: Disponibilizar APK direto no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mastermind-v0.75-salas-iluminadas-rotacao-analogica"
          cp app/build/outputs/apk/debug/app-debug.apk Mastermind-v0.75-Android.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" Mastermind-v0.75-Android.apk \
              --target "${GITHUB_SHA}" \
              --title "Mastermind v0.75 — Escuridão de Salas e Rotação Analógica" \
              --notes "Mastermind v0.75: escuridão automática apenas em salas estruturalmente fechadas e sem iluminação; ambientes abertos permanecem visíveis; portas abertas liberam luz ambiental; lanternas e tochas clareiam espaços internos; bloqueios manuais independentes. Rotação 360 graus arrastando as alças ao redor do token como analógico, com atualização suave e gravação ao soltar."
          else
            gh release upload "$TAG" Mastermind-v0.75-Android.apk --clobber
          fi
